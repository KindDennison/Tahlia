<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #56ab2f;
    cursor: none;
  }

  #gardenCanvas {
    width: 100vw;
    height: 100vh;
    display: block;
  }
</style>
</head>

<body>
<canvas id="gardenCanvas"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJXVZE2VZXPH9jJvzgz9ozBvvbiJfmLbw",
  authDomain: "teamdennisontracker.firebaseapp.com",
  projectId: "teamdennisontracker",
  storageBucket: "teamdennisontracker.firebasestorage.app",
  messagingSenderId: "915336870349",
  appId: "1:915336870349:web:c070e9b3fc0b688fe62c84"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const gc = document.getElementById("gardenCanvas");
const gx = gc.getContext("2d");

let GW;
let GH;
let DPR;

function resizeGarden() {
  DPR = window.devicePixelRatio || 1;
  GW = gc.clientWidth;
  GH = gc.clientHeight;

  gc.width = Math.round(GW * DPR);
  gc.height = Math.round(GH * DPR);

  gx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resizeGarden);
resizeGarden();

const creatures = [];
const seen = new Set();
const LIFETIME_MS = 90000;

const q = query(
  collection(db, "creatures"),
  where("habitat", "==", "garden")
);

onSnapshot(
  q,
  (snap) => {
    console.log("Garden snapshot received. Documents:", snap.size);

    snap.docChanges().forEach((change) => {
      if (change.type === "removed") {
        creatures.forEach(s => { if (s.docId === change.doc.id) s.dying = true; });
        seen.delete(change.doc.id);
        return;
      }

      if (change.type !== "added") return;
      if (seen.has(change.doc.id)) return;

      seen.add(change.doc.id);

      const data = change.doc.data();

      console.log("Garden creature found:", change.doc.id, data);

      if (!data.img) {
        console.warn("Creature skipped because img field is missing:", change.doc.id, data);
        return;
      }

      const animal = String(data.animal || "butterfly").toLowerCase().trim();

      spawn(data.img, animal, change.doc.id);
    });
  },
  (error) => {
    console.error("Error listening for garden creatures:", error);
  }
);

function spawn(dataUrl, animal, docId) {
  const img = new Image();

  img.onload = () => {
    const isFrog = animal === "frog";
    const isLadybird = animal === "ladybird";

    creatures.push({
      img,
      animal,
      x: Math.random() * GW * 0.8 + GW * 0.1,
      y: isFrog || isLadybird
        ? GH - Math.random() * 180 - 80
        : Math.random() * GH * 0.7 + GH * 0.1,
      vx: (Math.random() - 0.5) * (isFrog || isLadybird ? 0.8 : 1.6),
      vy: (Math.random() - 0.5) * (isFrog || isLadybird ? 0.4 : 1.6),
      wobble: Math.random() * Math.PI * 2,
      scale: 0.5 + Math.random() * 0.45,
      docId,
      born: performance.now(),
      alpha: 0
    });

    console.log("Spawned garden creature:", animal);
  };

  img.onerror = () => {
    console.error("Failed to load creature image:", animal);
  };

  img.src = dataUrl;
}

function drawGardenBg() {
  const g = gx.createLinearGradient(0, 0, 0, GH);
  g.addColorStop(0, "#aee571");
  g.addColorStop(1, "#56ab2f");

  gx.fillStyle = g;
  gx.fillRect(0, 0, GW, GH);

  gx.save();

  const cols = ["#ff5252", "#ffeb3b", "#e040fb", "#40c4ff"];

  for (let i = 0; i < 14; i++) {
    const fxp = (i * 167) % GW;
    const fyp = GH - 30 - ((i * 61) % 140);

    gx.strokeStyle = "#2e7d32";
    gx.lineWidth = 4;

    gx.beginPath();
    gx.moveTo(fxp, GH);
    gx.lineTo(fxp, fyp);
    gx.stroke();

    gx.fillStyle = cols[i % cols.length];

    for (let p = 0; p < 5; p++) {
      const a = p / 5 * Math.PI * 2;
      gx.beginPath();
      gx.arc(fxp + Math.cos(a) * 11, fyp + Math.sin(a) * 11, 7, 0, Math.PI * 2);
      gx.fill();
    }

    gx.fillStyle = "#fff";
    gx.beginPath();
    gx.arc(fxp, fyp, 6, 0, Math.PI * 2);
    gx.fill();
  }

  gx.restore();
}

function updateCreature(c) {
  if (c.animal === "frog") {
    c.wobble += 0.08;
    c.x += c.vx;
    c.y += Math.sin(c.wobble) * 0.8;

    if (Math.random() < 0.015) {
      c.vx = (Math.random() - 0.5) * 4;
      c.y -= 25;
    }

    c.y += 0.6;

    if (c.y > GH - 90) c.y = GH - 90;
  }

  else if (c.animal === "ladybird") {
    c.wobble += 0.06;
    c.x += c.vx;
    c.y += Math.sin(c.wobble) * 0.25;
  }

  else {
    c.wobble += 0.25;
    c.x += c.vx;
    c.y += c.vy;

    c.vx += (Math.random() - 0.5) * 0.15;
    c.vy += (Math.random() - 0.5) * 0.15;

    c.vx = Math.max(-2.2, Math.min(2.2, c.vx));
    c.vy = Math.max(-2.2, Math.min(2.2, c.vy));
  }

  if (c.x < 50 || c.x > GW - 50) c.vx *= -1;
  if (c.y < 50 || c.y > GH - 50) c.vy *= -1;
}

function drawCreature(c) {
  const flap = Math.abs(Math.cos(c.wobble));

  gx.save();
  gx.globalAlpha = c.alpha;
  gx.translate(c.x, c.y);

  if (c.animal === "butterfly" || c.animal === "bee") {
    gx.rotate(Math.atan2(c.vy, c.vx) + Math.PI / 2);
    gx.scale(c.scale * (0.4 + 0.6 * flap), c.scale);
  }

  else if (c.animal === "frog") {
    gx.rotate(Math.sin(c.wobble) * 0.05);
    gx.scale(c.scale, c.scale);
  }

  else {
    gx.rotate(Math.sin(c.wobble) * 0.08);
    gx.scale(c.scale, c.scale);
  }

  const drawWidth = 320;
  const drawHeight = 300;

  gx.drawImage(c.img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
  gx.restore();
}

function loop(now) {
  drawGardenBg();

  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const age = now - c.born;

    if (c.dying) {
      c.alpha = Math.max(0, c.alpha - 0.025);
      if (c.alpha <= 0) { creatures.splice(i, 1); continue; }
    } else if (age < 1000) {
      c.alpha = age / 1000;
    } else if (age > LIFETIME_MS - 2000) {
      c.alpha = Math.max(0, (LIFETIME_MS - age) / 2000);
    } else {
      c.alpha = 1;
    }

    if (age > LIFETIME_MS) {
      creatures.splice(i, 1);
      continue;
    }

    updateCreature(c);
    drawCreature(c);
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
