<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Butterfly Garden</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #56ab2f; cursor: none; }
  #gardenCanvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="gardenCanvas"></canvas>

<script type="module">
/* ================== FIREBASE ================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, onSnapshot, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== PASTE FIREBASE CONFIG HERE (same as paint.html) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDJXVZE2VZXPH9jJvzgz9ozBvvbiJfmLbw",
  authDomain: "teamdennisontracker.firebaseapp.com",
  projectId: "teamdennisontracker",
  storageBucket: "teamdennisontracker.firebasestorage.app",
  messagingSenderId: "915336870349",
  appId: "1:915336870349:web:c070e9b3fc0b688fe62c84"
};
/* =========================================================== */

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* ================== GARDEN CANVAS ================== */
const gc = document.getElementById('gardenCanvas');
const gx = gc.getContext('2d');
let GW, GH;
function resizeGarden(){ GW=gc.width=gc.clientWidth; GH=gc.height=gc.clientHeight; }
window.addEventListener('resize', resizeGarden); resizeGarden();

const flyers = [];
const seen = new Set();           // doc IDs we've already spawned
const LIFETIME_MS = 90000;        // butterfly lives 90s, then fades out

/* Only listen for butterflies created in the last 2 minutes, newest first.
   This keeps the projector from re-spawning the whole history on load. */
const since = Timestamp.fromMillis(Date.now() - 120000);
const q = query(
  collection(db, "butterflies"),
  where("createdAt", ">", since),
  orderBy("createdAt")
);

onSnapshot(q, (snap)=>{
  snap.docChanges().forEach(change=>{
    if (change.type === "added" && !seen.has(change.doc.id)) {
      seen.add(change.doc.id);
      spawn(change.doc.data().img);
    }
  });
});

function spawn(dataUrl){
  const img = new Image();
  img.src = dataUrl;
  img.onload = ()=>{
    flyers.push({
      img,
      x: Math.random()*GW*0.8+GW*0.1,
      y: Math.random()*GH*0.8+GH*0.1,
      vx:(Math.random()-0.5)*1.6, vy:(Math.random()-0.5)*1.6,
      flap:Math.random()*Math.PI*2,
      scale:0.6+Math.random()*0.4,
      born: performance.now(),
      alpha: 0
    });
  };
}

/* ================== BACKGROUND ================== */
function drawGardenBg(){
  let g=gx.createLinearGradient(0,0,0,GH);
  g.addColorStop(0,"#aee571"); g.addColorStop(1,"#56ab2f");
  gx.fillStyle=g; gx.fillRect(0,0,GW,GH);
  gx.save();
  const cols=["#ff5252","#ffeb3b","#e040fb","#40c4ff"];
  for(let i=0;i<10;i++){
    const fxp=(i*167%GW), fyp=GH-30-(i*61%120);
    gx.strokeStyle="#2e7d32"; gx.lineWidth=4;
    gx.beginPath(); gx.moveTo(fxp,GH); gx.lineTo(fxp,fyp); gx.stroke();
    gx.fillStyle=cols[i%cols.length];
    for(let p=0;p<5;p++){ const a=p/5*Math.PI*2;
      gx.beginPath(); gx.arc(fxp+Math.cos(a)*11,fyp+Math.sin(a)*11,7,0,Math.PI*2); gx.fill(); }
    gx.fillStyle="#fff"; gx.beginPath(); gx.arc(fxp,fyp,6,0,Math.PI*2); gx.fill();
  }
  gx.restore();
}

/* ================== ANIMATION LOOP ================== */
function loop(now){
  drawGardenBg();
  for(let i=flyers.length-1;i>=0;i--){
    const b=flyers[i];
    const age = now - b.born;

    // fade in over 1s, fade out over last 2s
    if (age < 1000) b.alpha = age/1000;
    else if (age > LIFETIME_MS - 2000) b.alpha = Math.max(0,(LIFETIME_MS-age)/2000);
    else b.alpha = 1;
    if (age > LIFETIME_MS){ flyers.splice(i,1); continue; }

    b.x+=b.vx; b.y+=b.vy; b.flap+=0.25;
    b.vx+=(Math.random()-0.5)*0.15; b.vy+=(Math.random()-0.5)*0.15;
    b.vx=Math.max(-2.2,Math.min(2.2,b.vx)); b.vy=Math.max(-2.2,Math.min(2.2,b.vy));
    if(b.x<50||b.x>GW-50) b.vx*=-1;
    if(b.y<50||b.y>GH-50) b.vy*=-1;

    const flap=Math.abs(Math.cos(b.flap));
    gx.save();
    gx.globalAlpha = b.alpha;
    gx.translate(b.x,b.y);
    gx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);
    gx.scale(b.scale*(0.4+0.6*flap), b.scale);
    gx.drawImage(b.img,-160,-150);   // image is 320x300
    gx.restore();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
