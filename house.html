<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #8d6e63;
    cursor: none;
  }

  #houseCanvas {
    width: 100vw;
    height: 100vh;
    display: block;
  }
</style>
</head>

<body>
<canvas id="houseCanvas"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJXVZE2VZXPH9jJvzgz9ozBvvbiJfmLbw",
  authDomain: "teamdennisontracker.firebaseapp.com",
  projectId: "teamdennisontracker",
  storageBucket: "teamdennisontracker.firebasestorage.app",
  messagingSenderId: "915336870349",
  appId: "1:915336870349:web:c070e9b3fc0b688fe62c84"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const hc = document.getElementById("houseCanvas");
const hx = hc.getContext("2d");

let HW;
let HH;
let DPR;

function resizeHouse() {
  DPR = window.devicePixelRatio || 1;
  HW = hc.clientWidth;
  HH = hc.clientHeight;

  hc.width = Math.round(HW * DPR);
  hc.height = Math.round(HH * DPR);

  hx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resizeHouse);
resizeHouse();

const creatures = [];
const seen = new Set();
const LIFETIME_MS = 90000;

const q = query(
  collection(db, "creatures"),
  where("habitat", "==", "house")
);

onSnapshot(
  q,
  (snap) => {
    console.log("House snapshot received. Documents:", snap.size);

    snap.docChanges().forEach((change) => {
      if (change.type !== "added") return;
      if (seen.has(change.doc.id)) return;

      seen.add(change.doc.id);

      const data = change.doc.data();

      console.log("House creature found:", change.doc.id, data);

      if (!data.img) {
        console.warn("Creature skipped because img field is missing:", change.doc.id, data);
        return;
      }

      const animal = String(data.animal || "cat").toLowerCase().trim();

      spawn(data.img, animal);
    });
  },
  (error) => {
    console.error("Error listening for house creatures:", error);
  }
);

function spawn(dataUrl, animal) {
  const img = new Image();

  img.onload = () => {
    const isFloor = ["cat", "dog", "rabbit", "hamster", "guinea_pig"].includes(animal);
    const isAerial = ["parrot", "budgie", "sparrow"].includes(animal);

    creatures.push({
      img,
      animal,
      x: Math.random() * HW * 0.8 + HW * 0.1,
      y: isFloor
        ? HH - Math.random() * 100 - 120
        : isAerial
          ? Math.random() * HH * 0.5 + HH * 0.1
          : Math.random() * HH * 0.65 + HH * 0.15,
      vx: (Math.random() - 0.5) * (isFloor ? 1.0 : 1.8),
      vy: (Math.random() - 0.5) * (isFloor ? 0.2 : isAerial ? 1.2 : 0.8),
      wobble: Math.random() * Math.PI * 2,
      scale: 0.5 + Math.random() * 0.45,
      born: performance.now(),
      alpha: 0
    });

    console.log("Spawned house creature:", animal);
  };

  img.onerror = () => {
    console.error("Failed to load creature image:", animal);
  };

  img.src = dataUrl;
}

function drawHouseBg() {
  const g = hx.createLinearGradient(0, 0, 0, HH);
  g.addColorStop(0, "#e8dcc8");
  g.addColorStop(1, "#d7ccc8");

  hx.fillStyle = g;
  hx.fillRect(0, 0, HW, HH);

  hx.save();

  hx.fillStyle = "#a1887f";
  hx.fillRect(0, HH - 160, HW, 160);

  for (let i = 0; i < 12; i++) {
    const px = (i * 189) % HW;
    const py = HH - 160;

    hx.fillStyle = i % 2 ? "#8d6e63" : "#9d8b81";
    hx.fillRect(px, py, 80, 160);

    hx.strokeStyle = "#a1887f";
    hx.lineWidth = 2;
    hx.strokeRect(px, py, 80, 160);
  }

  for (let i = 0; i < 5; i++) {
    const wx = (i * 301 + 50) % HW;
    const wy = Math.sin(i) * 30 + HH * 0.15;

    hx.fillStyle = "#90caf9";
    hx.fillRect(wx, wy, 120, 90);

    hx.fillStyle = "#1976d2";
    hx.fillRect(wx + 10, wy + 10, 45, 35);
    hx.fillRect(wx + 65, wy + 10, 45, 35);
    hx.fillRect(wx + 10, wy + 50, 45, 30);
    hx.fillRect(wx + 65, wy + 50, 45, 30);

    hx.strokeStyle = "#616161";
    hx.lineWidth = 3;
    hx.strokeRect(wx, wy, 120, 90);
  }

  hx.fillStyle = "#ffb74d";
  for (let i = 0; i < 4; i++) {
    const lx = (i * 247) % HW;
    const ly = HH * 0.35;

    hx.beginPath();
    hx.arc(lx + 15, ly, 12, 0, Math.PI * 2);
    hx.fill();

    hx.fillStyle = "#fdd835";
    hx.beginPath();
    hx.arc(lx + 15, ly, 8, 0, Math.PI * 2);
    hx.fill();

    hx.fillStyle = "#ffb74d";
  }

  hx.restore();
}

function updateCreature(c) {
  const isFloor = ["cat", "dog", "rabbit", "hamster", "guinea_pig"].includes(c.animal);
  const isAerial = ["parrot", "budgie", "sparrow"].includes(c.animal);

  if (isFloor) {
    c.wobble += 0.1;
    c.x += c.vx;
    c.y += Math.sin(c.wobble) * 0.5;

    if (Math.random() < 0.02) {
      c.vx = (Math.random() - 0.5) * 3;
    }

    c.y += 0.4;

    if (c.y > HH - 130) c.y = HH - 130;
  } else if (isAerial) {
    c.wobble += 0.22;
    c.x += c.vx;
    c.y += c.vy;

    c.vx += (Math.random() - 0.5) * 0.12;
    c.vy += (Math.random() - 0.5) * 0.12;

    c.vx = Math.max(-2.0, Math.min(2.0, c.vx));
    c.vy = Math.max(-1.8, Math.min(1.8, c.vy));
  } else {
    c.wobble += 0.16;
    c.x += c.vx;
    c.y += c.vy;

    c.vx += (Math.random() - 0.5) * 0.1;
    c.vy += (Math.random() - 0.5) * 0.1;

    c.vx = Math.max(-1.8, Math.min(1.8, c.vx));
    c.vy = Math.max(-1.6, Math.min(1.6, c.vy));
  }

  if (c.x < 50 || c.x > HW - 50) c.vx *= -1;
  if (c.y < 50 || c.y > HH - 130) c.vy *= -1;
}

function drawCreature(c) {
  const isAerial = ["parrot", "budgie", "sparrow"].includes(c.animal);
  const flap = isAerial ? Math.abs(Math.cos(c.wobble)) : 1;

  hx.save();
  hx.globalAlpha = c.alpha;
  hx.translate(c.x, c.y);

  if (isAerial) {
    hx.rotate(Math.atan2(c.vy, c.vx) + Math.PI / 2);
    hx.scale(c.scale * (0.45 + 0.55 * flap), c.scale);
  } else {
    hx.rotate(Math.sin(c.wobble) * 0.07);
    hx.scale(c.scale, c.scale);
  }

  const drawWidth = 320;
  const drawHeight = 300;

  hx.drawImage(c.img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
  hx.restore();
}

function loop(now) {
  drawHouseBg();

  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const age = now - c.born;

    if (age < 1000) {
      c.alpha = age / 1000;
    } else if (age > LIFETIME_MS - 2000) {
      c.alpha = Math.max(0, (LIFETIME_MS - age) / 2000);
    } else {
      c.alpha = 1;
    }

    if (age > LIFETIME_MS) {
      creatures.splice(i, 1);
      continue;
    }

    updateCreature(c);
    drawCreature(c);
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
