<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paint an Animal</title>

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0; padding: 0;
  }

  html, body {
    width: 100%; height: 100%;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    background: #f4f1e0;
    /* allow body to scroll in portrait */
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  select, button, input { font-family: inherit; }

  /* ═══════════════════════════════════
     PORTRAIT — stacked, body scrolls
  ═══════════════════════════════════ */

  /* outer wrapper: just a centred column */
  #paintPanel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 10px 20px;
    width: 100%;
  }

  /* picker column — full width in portrait */
  #pickerCol {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    max-width: 540px;
  }

  /* canvas column — centred, full width */
  #canvasCol {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 540px;
  }

  /* title */
  h1 {
    font-size: clamp(0.95em, 4vw, 1.5em);
    color: #33691e;
    text-align: center;
  }

  /* ── Habitat tabs ── */
  #habitatTabs {
    display: flex;
    flex-direction: row;
    gap: 5px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding: 2px 2px 4px;
    width: 100%;
  }
  #habitatTabs::-webkit-scrollbar { display: none; }

  .hTab {
    flex: 1 1 0;
    min-width: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 5px 4px 4px;
    border-radius: 12px;
    border: 3px solid transparent;
    cursor: pointer;
    font-size: clamp(0.5em, 2vw, 0.75em);
    font-weight: bold;
    color: #fff;
    transition: transform .15s, box-shadow .15s;
    user-select: none; -webkit-user-select: none;
    white-space: nowrap;
  }
  .hTab .tabEmoji { font-size: clamp(1.1em, 4vw, 1.5em); line-height: 1.2; }
  .hTab.active {
    border-color: #fff;
    transform: scale(1.08);
    box-shadow: 0 3px 10px rgba(0,0,0,.3);
  }

  /* ── Animal grid ── */
  #animalPicker {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    width: 100%;
  }

  .animalBtn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: #fff;
    border: 3px solid #ddd;
    border-radius: 10px;
    padding: 4px 3px 5px;
    cursor: pointer;
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .animalBtn img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: contain;
    border-radius: 6px;
    pointer-events: none;
    display: block;
  }
  .animalBtn span {
    font-size: clamp(0.5em, 2vw, 0.72em);
    font-weight: bold;
    color: #444;
    text-align: center;
    line-height: 1.1;
  }
  .animalBtn.active {
    border-color: var(--habitat-color, #ff7043);
    box-shadow: 0 0 0 3px var(--habitat-color, #ff7043);
    transform: scale(1.05);
  }

  /* ── Canvas ── */
  #paintWrap {
    position: relative;
    touch-action: none;
    /* width/height set by JS; make sure it centres */
    display: flex;
    justify-content: center;
  }

  #paintCanvas {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    display: block;
  }

  /* ── Palette — same width as canvas, wraps neatly ── */
  #palette {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(5px, 2vw, 10px);
    width: 100%;
  }

  .swatch {
    width:  clamp(32px, 7vw, 52px);
    height: clamp(32px, 7vw, 52px);
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
    cursor: pointer;
    flex-shrink: 0;
  }
  .swatch.active { border-color: #333; transform: scale(1.18); }

  /* ── Brush row ── */
  #brushRow {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #brushRow label { font-size: clamp(.85em, 2.5vw, 1.1em); color: #555; }
  #brushSize { width: clamp(120px, 38vw, 260px); }
  #brushPreview {
    width:  clamp(28px, 6vw, 44px);
    height: clamp(28px, 6vw, 44px);
    display: flex; align-items: center; justify-content: center;
  }
  #brushPreview div { background: #333; border-radius: 50%; }

  /* ── Send button ── */
  #sendBtn {
    font-size: clamp(1em, 3vw, 1.5em);
    font-weight: bold;
    color: #fff;
    background: #ff7043;
    border: none;
    padding: clamp(8px, 2vw, 14px) clamp(22px, 6vw, 42px);
    border-radius: 40px;
    box-shadow: 0 4px 0 #d84315;
    cursor: pointer;
  }
  #sendBtn:active  { transform: translateY(3px); box-shadow: 0 1px 0 #d84315; }
  #sendBtn:disabled { opacity: .5; }

  #status {
    min-height: 1.4em;
    font-size: clamp(.75em, 2vw, 1em);
    color: #777;
    text-align: center;
  }

  /* ═══════════════════════════════════════════════
     LANDSCAPE — two columns, nothing scrolls
     Left: picker  |  Right: title + canvas + tools
  ═══════════════════════════════════════════════ */
  @media (orientation: landscape) {
    html, body { overflow: hidden; }

    #paintPanel {
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      padding: 6px 10px;
      gap: 10px;
      height: 100vh;
      overflow: hidden;
    }

    /* LEFT: picker, fixed width, internal scroll if needed */
    #pickerCol {
      flex: 0 0 auto;
      width: clamp(150px, 26vw, 220px);
      max-width: none;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      gap: 5px;
      align-items: stretch;
    }
    #pickerCol::-webkit-scrollbar { display: none; }

    /* tabs go vertical in landscape */
    #habitatTabs {
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: visible;
      padding: 2px;
      gap: 4px;
    }
    .hTab {
      flex: 0 0 auto;
      flex-direction: row;
      justify-content: flex-start;
      gap: 7px;
      padding: 5px 8px;
      font-size: clamp(0.58em, 1.5vh, 0.8em);
      min-width: unset;
      border-radius: 10px;
    }
    .hTab .tabEmoji { font-size: clamp(1em, 2.5vh, 1.3em); }

    #animalPicker {
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }
    .animalBtn span { font-size: clamp(0.48em, 1.2vh, 0.68em); }

    /* RIGHT: canvas column, centred, fills remaining space */
    #canvasCol {
      flex: 1 1 0;
      min-width: 0;
      max-width: none;
      justify-content: center;
      overflow: hidden;
      gap: 5px;
    }

    h1 { font-size: clamp(0.8em, 2vh, 1.15em); }

    .swatch {
      width:  clamp(24px, 4.5vh, 40px);
      height: clamp(24px, 4.5vh, 40px);
    }
    #palette { gap: clamp(3px, 1.2vh, 8px); }

    #sendBtn {
      font-size: clamp(0.82em, 2vh, 1.2em);
      padding: clamp(5px, 1.2vh, 9px) clamp(14px, 3vw, 26px);
    }
    #brushSize { width: clamp(100px, 20vw, 200px); }
  }

  #adminToggle {
    position: fixed;
    right: 10px;
    bottom: 10px;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 18px;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    cursor: pointer;
    z-index: 20;
  }

  #adminPanel {
    display: none;
    position: fixed;
    inset: 3vmin;
    background: rgba(255,255,255,.96);
    z-index: 30;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    padding: 18px;
    overflow: auto;
    font-family: "Segoe UI", sans-serif;
  }

  #adminPanel h2 {
    margin-top: 0;
    color: #333;
  }

  .adminRow {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0;
    align-items: center;
  }

  .adminRow button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    background: #455a64;
    color: #fff;
    cursor: pointer;
  }

  .adminRow button.danger {
    background: #c62828;
  }

  .adminRow button.good {
    background: #2e7d32;
  }

  #adminList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    margin-top: 14px;
  }

  .adminCard {
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #fafafa;
    padding: 8px;
    text-align: center;
  }

  .adminCard img {
    width: 100%;
    height: 100px;
    object-fit: contain;
    background: #fff;
    border-radius: 8px;
  }

  .adminCard small {
    display: block;
    color: #555;
    margin: 4px 0 8px;
  }

  .adminCard button {
    width: 100%;
    margin-top: 4px;
    padding: 7px;
    border: none;
    border-radius: 8px;
    color: #fff;
    background: #1976d2;
    cursor: pointer;
  }

  .adminCard button.danger {
    background: #c62828;
  }
</style>
</head>

<body>

<div id="paintPanel">

  <!-- LEFT / TOP: habitat tabs + animal picker -->
  <div id="pickerCol">
    <div id="habitatTabs"></div>
    <div id="animalPicker"></div>
  </div>

  <!-- RIGHT / BOTTOM: title + canvas + palette + controls -->
  <div id="canvasCol">
    <h1 id="titleText">Paint your butterfly, then let it fly!</h1>

    <div id="paintWrap">
      <canvas id="paintCanvas"></canvas>
    </div>

    <div id="palette"></div>

    <div id="brushRow">
      <label for="brushSize">Brush</label>
      <input type="range" id="brushSize" min="6" max="40" value="16">
      <div id="brushPreview"><div></div></div>
    </div>

    <button id="sendBtn">Send away! 🦋</button>
    <div id="status"></div>
  </div>

  <!-- hidden select kept for JS compatibility -->
  <select id="animalSelect" style="display:none">
    <option value="butterfly">Butterfly</option>
    <option value="ladybird">Ladybird</option>
    <option value="bee">Bee</option>
    <option value="frog">Frog</option>
    <option value="fish">Fish</option>
    <option value="turtle">Turtle</option>
    <option value="jellyfish">Jellyfish</option>
    <option value="shark">Shark</option>
    <option value="lion">Lion</option>
    <option value="zebra">Zebra</option>
    <option value="rhino">Rhino</option>
    <option value="elephant">Elephant</option>
    <option value="cat">Cat</option>
    <option value="dog">Dog</option>
    <option value="hamster">Hamster</option>
    <option value="snake">Snake</option>
    <option value="rose">Rose</option>
    <option value="sunflower">Sunflower</option>
    <option value="tulip">Tulip</option>
  </select>

</div>

<button id="adminToggle">Admin</button>

<div id="adminPanel">
  <h2>Admin Area</h2>

  <div id="pinArea" class="adminRow">
    <input id="adminPin" type="password" placeholder="PIN">
    <button id="unlockAdmin">Unlock</button>
    <button id="closeAdmin">Close</button>
  </div>

  <div id="adminTools" style="display:none;">
    <div class="adminRow">
      <button id="loadRecent" class="good">Load recent drawings</button>
      <button id="deleteGarden" class="danger">Delete garden drawings</button>
      <button id="deleteAquarium" class="danger">Delete aquarium drawings</button>
      <button id="deleteSafari" class="danger">Delete safari drawings</button>
      <button id="deleteHouse" class="danger">Delete house drawings</button>
      <button id="deleteFlowers" class="danger">Delete flower drawings</button>
      <button id="deleteAll" class="danger">Delete ALL drawings</button>
      <button id="closeAdmin2">Close</button>
    </div>

    <div id="adminStatus"></div>
    <div id="adminList"></div>
  </div>
</div>

<script type="module">
/* ============================================================
   FIREBASE
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  getDocs,
  deleteDoc,
  doc,
  query,
  where,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJXVZE2VZXPH9jJvzgz9ozBvvbiJfmLbw",
  authDomain: "teamdennisontracker.firebaseapp.com",
  projectId: "teamdennisontracker",
  storageBucket: "teamdennisontracker.firebasestorage.app",
  messagingSenderId: "915336870349",
  appId: "1:915336870349:web:c070e9b3fc0b688fe62c84"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const creaturesCol = collection(db, "creatures");

/* ============================================================
   CONFIG
   ============================================================ */
const ADMIN_PIN = "1234";          // change this
const IMG_PATH  = "./images/";     // where the outline PNGs live

/* Habitat definitions — drives the tab bar and animal grid */
const HABITATS = [
  {
    id: "garden",
    label: "Garden",
    emoji: "🌿",
    color: "#43a047",
    animals: ["butterfly","ladybird","bee","frog"]
  },
  {
    id: "aquarium",
    label: "Aquarium",
    emoji: "🐠",
    color: "#1e88e5",
    animals: ["fish","turtle","jellyfish","shark"]
  },
  {
    id: "safari",
    label: "Safari",
    emoji: "🦁",
    color: "#fb8c00",
    animals: ["lion","zebra","rhino","elephant"]
  },
  {
    id: "house",
    label: "House",
    emoji: "🏠",
    color: "#8e24aa",
    animals: ["cat","dog","hamster","snake"]
  },
  {
    id: "flowers",
    label: "Flowers",
    emoji: "🌸",
    color: "#e91e8c",
    animals: ["rose","sunflower","tulip"]
  }
];

// Friendly verb per scene, used in the title + button.
const VERBS = {
  butterfly:"fly",  ladybird:"fly",   bee:"fly",      frog:"hop",
  fish:"swim",      turtle:"swim",    jellyfish:"swim", shark:"swim",
  lion:"roam",      zebra:"roam",     rhino:"roam",    elephant:"roam",
  cat:"play",       dog:"play",       hamster:"play",  snake:"slither",
  rose:"bloom",     sunflower:"bloom",  tulip:"bloom"
};

const EMOJI = {
  butterfly:"🦋", ladybird:"🐞", bee:"🐝", frog:"🐸",
  fish:"🐟", turtle:"🐢", jellyfish:"🪼", shark:"🦈",
  lion:"🦁", zebra:"🦓", rhino:"🦏", elephant:"🐘",
  cat:"🐱", dog:"🐶", hamster:"🐹", snake:"🐍",
  rose:"🌹", sunflower:"🌻", tulip:"🌷"
};

const COLOURS = [
  "#e53935","#fb8c00","#fdd835","#43a047","#1e88e5",
  "#8e24aa","#ec407a","#6d4c41","#000000","#ffffff"
];

/* ============================================================
   ELEMENTS
   ============================================================ */
const canvas   = document.getElementById('paintCanvas');
const ctx      = canvas.getContext('2d', { willReadFrequently: true });
const wrap     = document.getElementById('paintWrap');
const palette  = document.getElementById('palette');
const sizeInp  = document.getElementById('brushSize');
const preview  = document.getElementById('brushPreview').firstElementChild;
const animalSel= document.getElementById('animalSelect');
const titleEl  = document.getElementById('titleText');
const sendBtn  = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');

/* ============================================================
   VISUAL ANIMAL PICKER
   ============================================================ */
const habitatTabsEl = document.getElementById('habitatTabs');
const animalPickerEl = document.getElementById('animalPicker');

let activeHabitat = HABITATS[0].id;

// Capitalise first letter for display
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function buildPicker() {
  // Build habitat tabs
  HABITATS.forEach(h => {
    const tab = document.createElement('button');
    tab.className = 'hTab' + (h.id === activeHabitat ? ' active' : '');
    tab.style.background = h.color;
    tab.dataset.habitat = h.id;
    tab.innerHTML = `<span class="tabEmoji">${h.emoji}</span>${h.label}`;
    tab.addEventListener('click', () => switchHabitat(h.id));
    habitatTabsEl.appendChild(tab);
  });

  renderAnimalGrid(activeHabitat);
}

function switchHabitat(habitatId) {
  activeHabitat = habitatId;
  // Update tab active state + CSS variable
  habitatTabsEl.querySelectorAll('.hTab').forEach(t => {
    t.classList.toggle('active', t.dataset.habitat === habitatId);
  });
  renderAnimalGrid(habitatId);
}

function renderAnimalGrid(habitatId) {
  const h = HABITATS.find(x => x.id === habitatId);
  animalPickerEl.innerHTML = '';
  animalPickerEl.style.setProperty('--habitat-color', h.color);

  // Up to 4 columns; fewer animals = wider buttons via auto-fill
  animalPickerEl.style.gridTemplateColumns =
    h.animals.length <= 3
      ? `repeat(${h.animals.length}, 1fr)`
      : 'repeat(4, 1fr)';

  h.animals.forEach(animal => {
    const btn = document.createElement('button');
    btn.className = 'animalBtn' + (animalSel.value === animal ? ' active' : '');
    btn.dataset.animal = animal;

    const img = document.createElement('img');
    img.src = IMG_PATH + animal + '.png';
    img.alt = animal;
    img.loading = 'lazy';
    // Fallback: show emoji if image missing
    img.onerror = () => {
      img.style.display = 'none';
      const fb = document.createElement('div');
      fb.style.cssText = 'font-size:2.5em;line-height:1;padding:6px 0';
      fb.textContent = EMOJI[animal] || '✨';
      btn.insertBefore(fb, btn.querySelector('span'));
    };

    const label = document.createElement('span');
    label.textContent = cap(animal);

    btn.appendChild(img);
    btn.appendChild(label);
    btn.addEventListener('click', () => selectAnimal(animal));
    animalPickerEl.appendChild(btn);
  });
}

function selectAnimal(animal) {
  // Update hidden select (keeps rest of JS working unchanged)
  animalSel.value = animal;
  // Highlight active button
  animalPickerEl.querySelectorAll('.animalBtn').forEach(b => {
    b.classList.toggle('active', b.dataset.animal === animal);
  });
  loadAnimal(animal);
}

buildPicker();

/* ============================================================
   STATE
   ============================================================ */
let brushColour = COLOURS[0];
let brushSize   = parseInt(sizeInp.value, 10);
let painting    = false;

// Layered canvases held in memory:
let fillCanvas, fillCtx;   // where the child's colour actually goes
let outlineImg;            // the loaded PNG
let maskData = null;       // Uint8 per-pixel: 1 = inside the lines, paintable
let ready = false;         // true once an animal image + mask are built

/* ============================================================
   PALETTE
   ============================================================ */
COLOURS.forEach((c, i) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (i === 0 ? ' active' : '');
  s.style.background = c;
  if (c.toLowerCase() === '#ffffff') s.style.border = '3px solid #bbb';
  s.addEventListener('click', () => {
    brushColour = c;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
  });
  palette.appendChild(s);
});

function updatePreview() {
  preview.style.width  = brushSize + 'px';
  preview.style.height = brushSize + 'px';
}
sizeInp.addEventListener('input', () => {
  brushSize = parseInt(sizeInp.value, 10);
  updatePreview();
});
updatePreview();

/* ============================================================
   CANVAS SIZING  — measures available space, never overflows
   ============================================================ */
function sizeCanvas() {
  const isLandscape = window.innerWidth > window.innerHeight;

  let size;
  if (isLandscape) {
    // Right column width = viewport minus left picker column minus gaps/padding
    const pickerW = Math.min(Math.max(150, window.innerWidth * 0.26), 220);
    const availW  = window.innerWidth  - pickerW - 30;   // 30 = gaps + padding
    // Height: leave room for title + palette + brush + button (approx 160px total)
    const availH  = window.innerHeight - 160;
    size = Math.floor(Math.min(availW, availH, 480));
  } else {
    // Portrait: full width minus padding, capped; height = ~40% of viewport
    const availW = Math.min(window.innerWidth - 20, 540);
    const availH = Math.floor(window.innerHeight * 0.40);
    size = Math.floor(Math.min(availW, availH, 480));
  }

  size = Math.max(size, 180); // never go below 180px
  canvas.style.width  = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width  = size;
  canvas.height = size;
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    sizeCanvas();
    if (animalSel.value) loadAnimal(animalSel.value);
  }, 100);
});
sizeCanvas();

/* ============================================================
   LOAD AN ANIMAL  (image-based, replaces the old vector code)
   ============================================================ */
function loadAnimal(name) {
  ready = false;
  sendBtn.disabled = true;
  statusEl.textContent = "Loading " + name + "…";

  const verb = VERBS[name] || "go";
  titleEl.textContent = "Paint your " + name + ", then let it " + verb + "!";
  sendBtn.textContent = "Send away! " + (EMOJI[name] || "✨");

  const img = new Image();
  img.crossOrigin = "anonymous";          // needed so we can read pixels
  img.onload = () => {
    outlineImg = img;

    // Build / resize the in-memory fill canvas to match the display canvas.
    fillCanvas = document.createElement('canvas');
    fillCanvas.width  = canvas.width;
    fillCanvas.height = canvas.height;
    fillCtx = fillCanvas.getContext('2d', { willReadFrequently: true });

    buildMask();
    redraw();

    ready = true;
    sendBtn.disabled = false;
    statusEl.textContent = "";
  };
  img.onerror = () => {
    statusEl.textContent = "Couldn't load " + name + ".png";
  };
  img.src = IMG_PATH + name + ".png";
}

/* ============================================================
   BUILD MASK
   Draw the outline once, then flood-fill from all four edges.
   Anything the flood can't reach (because the black outline blocks
   it) is "inside" the animal and therefore paintable.
   ============================================================ */
function buildMask() {
  const w = canvas.width, h = canvas.height;

  // Draw the outline, scaled to fit the canvas, into a temp context.
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const tctx = tmp.getContext('2d', { willReadFrequently: true });

  const scale = Math.min(w / outlineImg.width, h / outlineImg.height);
  const dw = outlineImg.width  * scale;
  const dh = outlineImg.height * scale;
  const dx = (w - dw) / 2;
  const dy = (h - dh) / 2;
  tctx.drawImage(outlineImg, dx, dy, dw, dh);

  const px = tctx.getImageData(0, 0, w, h).data;

  // line[i] = true where the outline is dark (a boundary the fill can't cross)
  const isLine = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const a = px[i * 4 + 3];
    const lum = (px[i*4] + px[i*4+1] + px[i*4+2]) / 3;
    if (a > 40 && lum < 110) isLine[i] = 1;
  }

  // Flood fill the "outside" starting from every edge pixel.
  const outside = new Uint8Array(w * h);
  const stack = [];
  for (let x = 0; x < w; x++) { stack.push(x); stack.push((h-1)*w + x); }
  for (let y = 0; y < h; y++) { stack.push(y*w); stack.push(y*w + (w-1)); }

  while (stack.length) {
    const i = stack.pop();
    if (i < 0 || i >= w*h) continue;
    if (outside[i] || isLine[i]) continue;
    outside[i] = 1;
    const x = i % w, y = (i / w) | 0;
    if (x > 0)   stack.push(i - 1);
    if (x < w-1) stack.push(i + 1);
    if (y > 0)   stack.push(i - w);
    if (y < h-1) stack.push(i + w);
  }

  // Paintable = not outside and not the line itself.
  maskData = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    maskData[i] = (!outside[i] && !isLine[i]) ? 1 : 0;
  }
}

/* ============================================================
   DRAW A BRUSH DAB (masked so it stays inside the lines)
   ============================================================ */
function dab(x, y) {
  if (!ready) return;
  const r = brushSize / 2;

  // Paint the dab onto the fill canvas.
  fillCtx.fillStyle = brushColour;
  fillCtx.beginPath();
  fillCtx.arc(x, y, r, 0, Math.PI * 2);
  fillCtx.fill();

  // Erase any part of the dab that fell outside the mask.
  const x0 = Math.max(0, Math.floor(x - r));
  const y0 = Math.max(0, Math.floor(y - r));
  const x1 = Math.min(canvas.width  - 1, Math.ceil(x + r));
  const y1 = Math.min(canvas.height - 1, Math.ceil(y + r));
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  if (bw <= 0 || bh <= 0) return;

  const img = fillCtx.getImageData(x0, y0, bw, bh);
  const d = img.data;
  for (let yy = 0; yy < bh; yy++) {
    for (let xx = 0; xx < bw; xx++) {
      const mi = (y0 + yy) * canvas.width + (x0 + xx);
      if (!maskData[mi]) {
        d[(yy * bw + xx) * 4 + 3] = 0;   // outside the lines -> transparent
      }
    }
  }
  fillCtx.putImageData(img, x0, y0);

  redraw();
}

/* ============================================================
   REDRAW: white bg -> child's fill -> black outline on top
   ============================================================ */
function redraw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  ctx.drawImage(fillCanvas, 0, 0);

  const scale = Math.min(w / outlineImg.width, h / outlineImg.height);
  const dw = outlineImg.width  * scale;
  const dh = outlineImg.height * scale;
  ctx.drawImage(outlineImg, (w - dw)/2, (h - dh)/2, dw, dh);
}

/* ============================================================
   POINTER HANDLING
   ============================================================ */
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width  / rect.width;
  const sy = canvas.height / rect.height;
  const p = e.touches ? e.touches[0] : e;
  return {
    x: (p.clientX - rect.left) * sx,
    y: (p.clientY - rect.top)  * sy
  };
}

let lastX, lastY;

function startPaint(e) {
  if (!ready) return;
  painting = true;
  const { x, y } = getPos(e);
  lastX = x; lastY = y;
  dab(x, y);
}

function movePaint(e) {
  if (!painting) return;
  e.preventDefault();
  const { x, y } = getPos(e);
  // Interpolate so fast strokes don't leave gaps.
  const dist = Math.hypot(x - lastX, y - lastY);
  const steps = Math.max(1, Math.floor(dist / (brushSize / 4)));
  for (let i = 1; i <= steps; i++) {
    dab(lastX + (x - lastX) * i / steps,
        lastY + (y - lastY) * i / steps);
  }
  lastX = x; lastY = y;
}

function endPaint() { painting = false; }

canvas.addEventListener('mousedown', startPaint);
canvas.addEventListener('mousemove', movePaint);
window.addEventListener('mouseup', endPaint);
canvas.addEventListener('touchstart', startPaint, { passive: false });
canvas.addEventListener('touchmove', movePaint, { passive: false });
canvas.addEventListener('touchend', endPaint);

/* ============================================================
   SAVE / SEND  →  Firestore
   ============================================================ */
function currentAnimal() { return animalSel.value; }

const HABITAT = {
  butterfly:"garden", ladybird:"garden", bee:"garden",   frog:"garden",
  fish:"aquarium",    turtle:"aquarium", jellyfish:"aquarium", shark:"aquarium",
  lion:"safari",      zebra:"safari",    rhino:"safari",  elephant:"safari",
  cat:"house",        dog:"house",       hamster:"house", snake:"house",
  rose:"flowers",    sunflower:"flowers", tulip:"flowers"
};

sendBtn.addEventListener('click', async () => {
  if (!ready) return;

  const animal  = currentAnimal();
  const habitat = HABITAT[animal] || "garden";
  const emoji   = EMOJI[animal] || "✨";

  // Export with transparent background so the aquarium scene shows through.
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width  = canvas.width;
  exportCanvas.height = canvas.height;
  const exportCtx = exportCanvas.getContext('2d');
  // 1. child's colour fill (already masked to inside-the-lines)
  exportCtx.drawImage(fillCanvas, 0, 0);
  // 2. black outline on top
  const scale = Math.min(canvas.width / outlineImg.width, canvas.height / outlineImg.height);
  const dw = outlineImg.width  * scale;
  const dh = outlineImg.height * scale;
  exportCtx.drawImage(outlineImg, (canvas.width - dw)/2, (canvas.height - dh)/2, dw, dh);
  const dataUrl = exportCanvas.toDataURL('image/png');

  sendBtn.disabled = true;
  statusEl.textContent = `Sending to the ${habitat}…`;

  try {
    await addDoc(creaturesCol, {
      img: dataUrl,
      animal,
      habitat,
      createdAt: serverTimestamp()
    });

    statusEl.textContent = `Off it goes! ${emoji}`;
    // Fresh canvas for the next child.
    fillCtx.clearRect(0, 0, fillCanvas.width, fillCanvas.height);
    redraw();

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Hmm, couldn't send. Try again.";
  } finally {
    sendBtn.disabled = false;
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
  }
});

// animal selection is handled by the visual picker above

/* ============================================================
   ADMIN  →  Firestore
   ============================================================ */
const adminToggle  = document.getElementById('adminToggle');
const adminPanel   = document.getElementById('adminPanel');
const adminPin     = document.getElementById('adminPin');
const unlockAdmin  = document.getElementById('unlockAdmin');
const pinArea      = document.getElementById('pinArea');
const adminTools   = document.getElementById('adminTools');
const adminStatus  = document.getElementById('adminStatus');
const adminList    = document.getElementById('adminList');

adminToggle.onclick = () => {
  adminPanel.style.display = "block";
};

document.getElementById('closeAdmin').onclick  = closeAdmin;
document.getElementById('closeAdmin2').onclick = closeAdmin;
function closeAdmin() { adminPanel.style.display = "none"; }

unlockAdmin.onclick = () => {
  if (adminPin.value === ADMIN_PIN) {
    pinArea.style.display  = "none";
    adminTools.style.display = "block";
    adminStatus.textContent = "Admin unlocked.";
  } else {
    adminStatus.textContent = "Wrong PIN.";
  }
};

async function deleteByQuery(q, label) {
  if (!confirm(`Are you sure you want to delete ${label}?`)) return;
  adminStatus.textContent = "Deleting…";
  const snap = await getDocs(q);
  await Promise.all(snap.docs.map(d => deleteDoc(doc(db, "creatures", d.id))));
  adminStatus.textContent = `Deleted ${snap.size} drawing(s).`;
  loadRecentDrawings();
}

document.getElementById('deleteAll').onclick = async () => {
  await deleteByQuery(query(creaturesCol), "ALL drawings");
};
document.getElementById('deleteGarden').onclick = async () => {
  await deleteByQuery(query(creaturesCol, where("habitat","==","garden")), "all garden drawings");
};
document.getElementById('deleteAquarium').onclick = async () => {
  await deleteByQuery(query(creaturesCol, where("habitat","==","aquarium")), "all aquarium drawings");
};
document.getElementById('deleteSafari').onclick = async () => {
  await deleteByQuery(query(creaturesCol, where("habitat","==","safari")), "all safari drawings");
};
document.getElementById('deleteFlowers').onclick = async () => {
  await deleteByQuery(query(creaturesCol, where("habitat","==","flowers")), "all flower drawings");
};
document.getElementById('deleteHouse').onclick = async () => {
  await deleteByQuery(query(creaturesCol, where("habitat","==","house")), "all house drawings");
};
document.getElementById('loadRecent').onclick = loadRecentDrawings;

async function loadRecentDrawings() {
  adminStatus.textContent = "Loading recent drawings…";
  adminList.innerHTML = "";

  const q    = query(creaturesCol, orderBy("createdAt","desc"), limit(30));
  const snap = await getDocs(q);

  snap.forEach(d => {
    const data = d.data();

    const card = document.createElement("div");
    card.className = "adminCard";

    const img = document.createElement("img");
    img.src = data.img;

    const label = document.createElement("small");
    label.textContent = `${data.animal || "unknown"} / ${data.habitat || "unknown"}`;

    const respawnBtn = document.createElement("button");
    respawnBtn.textContent = "Respawn";
    respawnBtn.onclick = async () => {
      await addDoc(creaturesCol, {
        img: data.img,
        animal: data.animal,
        habitat: data.habitat,
        createdAt: serverTimestamp(),
        respawned: true
      });
      adminStatus.textContent = "Drawing respawned.";
    };

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "danger";
    deleteBtn.textContent = "Delete";
    deleteBtn.onclick = async () => {
      if (!confirm("Delete this drawing?")) return;
      await deleteDoc(doc(db, "creatures", d.id));
      adminStatus.textContent = "Drawing deleted.";
      loadRecentDrawings();
    };

    card.appendChild(img);
    card.appendChild(label);
    card.appendChild(respawnBtn);
    card.appendChild(deleteBtn);
    adminList.appendChild(card);
  });

  adminStatus.textContent = `Loaded ${snap.size} drawing(s).`;
}
