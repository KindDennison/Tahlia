<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paint an Animal</title>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    background: #f4f1e0;
  }

  #paintPanel {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vmin;
  }

  h1 {
    font-size: clamp(1.1em, 3.2vmin, 2.4em);
    color: #33691e;
    margin: 1vmin 0;
    text-align: center;
  }

  #topControls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1vmin;
    margin-bottom: 1vmin;
  }

  select, button, input {
    font-family: inherit;
  }

  select {
    font-size: clamp(.9em, 2vmin, 1.2em);
    padding: .7vmin 1.2vmin;
    border-radius: 12px;
    border: 2px solid #b7b7b7;
    background: #fff;
  }

  #paintWrap {
    position: relative;
    touch-action: none;
  }

  #paintCanvas {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    display: block;
  }

  #palette {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5vmin;
    margin: 2vmin 0 1vmin;
    max-width: 90vmin;
  }

  .swatch {
    width: 6vmin;
    height: 6vmin;
    min-width: 36px;
    min-height: 36px;
    max-width: 60px;
    max-height: 60px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
    cursor: pointer;
  }

  .swatch.active {
    border-color: #333;
    transform: scale(1.18);
  }

  #brushRow {
    display: flex;
    align-items: center;
    gap: 2vmin;
    margin: 1vmin 0 2vmin;
  }

  #brushRow label {
    font-size: clamp(.9em, 2.2vmin, 1.4em);
    color: #555;
  }

  #brushSize {
    width: 40vmin;
    max-width: 320px;
  }

  #brushPreview {
    width: 7vmin;
    height: 7vmin;
    max-width: 56px;
    max-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #brushPreview div {
    background: #333;
    border-radius: 50%;
  }

  #sendBtn {
    font-size: clamp(1.1em, 3vmin, 2em);
    font-weight: bold;
    color: #fff;
    background: #ff7043;
    border: none;
    padding: 2vmin 5vmin;
    border-radius: 40px;
    box-shadow: 0 4px 0 #d84315;
    cursor: pointer;
  }

  #sendBtn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #d84315;
  }

  #sendBtn:disabled {
    opacity: .5;
  }

  #status {
    height: 3vmin;
    font-size: clamp(.8em, 2vmin, 1.2em);
    color: #777;
    margin-top: 1vmin;
  }

  #adminToggle {
    position: fixed;
    right: 10px;
    bottom: 10px;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 18px;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    cursor: pointer;
    z-index: 20;
  }

  #adminPanel {
    display: none;
    position: fixed;
    inset: 3vmin;
    background: rgba(255,255,255,.96);
    z-index: 30;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    padding: 18px;
    overflow: auto;
    font-family: "Segoe UI", sans-serif;
  }

  #adminPanel h2 {
    margin-top: 0;
    color: #333;
  }

  .adminRow {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0;
    align-items: center;
  }

  .adminRow button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    background: #455a64;
    color: #fff;
    cursor: pointer;
  }

  .adminRow button.danger {
    background: #c62828;
  }

  .adminRow button.good {
    background: #2e7d32;
  }

  #adminList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    margin-top: 14px;
  }

  .adminCard {
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #fafafa;
    padding: 8px;
    text-align: center;
  }

  .adminCard img {
    width: 100%;
    height: 100px;
    object-fit: contain;
    background: #fff;
    border-radius: 8px;
  }

  .adminCard small {
    display: block;
    color: #555;
    margin: 4px 0 8px;
  }

  .adminCard button {
    width: 100%;
    margin-top: 4px;
    padding: 7px;
    border: none;
    border-radius: 8px;
    color: #fff;
    background: #1976d2;
    cursor: pointer;
  }

  .adminCard button.danger {
    background: #c62828;
  }
</style>
</head>

<body>

<div id="paintPanel">
  <h1 id="titleText">Paint your butterfly, then let it fly!</h1>

  <div id="topControls">
    <select id="animalSelect">
      <optgroup label="Garden">
        <option value="butterfly">Butterfly</option>
        <option value="ladybird">Ladybird</option>
        <option value="bee">Bee</option>
        <option value="frog">Frog</option>
      </optgroup>
      <optgroup label="Aquarium">
        <option value="fish">Fish</option>
        <option value="turtle">Turtle</option>
        <option value="jellyfish">Jellyfish</option>
        <option value="shark">Shark</option>
      </optgroup>
      <optgroup label="Safari">
        <option value="lion">Lion</option>
        <option value="zebra">Zebra</option>
        <option value="rhino">Rhino</option>
        <option value="elephant">Elephant</option>
      </optgroup>
      <optgroup label="House">
        <option value="cat">Cat</option>
        <option value="dog">Dog</option>
        <option value="hamster">Hamster</option>
        <option value="snake">Snake</option>
      </optgroup>
    </select>
  </div>

  <div id="paintWrap">
    <canvas id="paintCanvas" width="320" height="300"></canvas>
  </div>

  <div id="palette"></div>

  <div id="brushRow">
    <label for="brushSize">Brush</label>
    <input type="range" id="brushSize" min="6" max="40" value="16">
    <div id="brushPreview"><div></div></div>
  </div>

  <button id="sendBtn">Send away! 🦋</button>
  <div id="status"></div>
</div>

<button id="adminToggle">Admin</button>

<div id="adminPanel">
  <h2>Admin Area</h2>

  <div id="pinArea" class="adminRow">
    <input id="adminPin" type="password" placeholder="PIN">
    <button id="unlockAdmin">Unlock</button>
    <button id="closeAdmin">Close</button>
  </div>

  <div id="adminTools" style="display:none;">
    <div class="adminRow">
      <button id="loadRecent" class="good">Load recent drawings</button>
      <button id="deleteGarden" class="danger">Delete garden drawings</button>
      <button id="deleteAquarium" class="danger">Delete aquarium drawings</button>
      <button id="deleteSafari" class="danger">Delete safari drawings</button>
      <button id="deleteHouse" class="danger">Delete house drawings</button>
      <button id="deleteAll" class="danger">Delete ALL drawings</button>
      <button id="closeAdmin2">Close</button>
    </div>

    <div id="adminStatus"></div>
    <div id="adminList"></div>
  </div>
</div>

<script type="module">
/* ============================================================
   FIREBASE
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  getDocs,
  deleteDoc,
  doc,
  query,
  where,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJXVZE2VZXPH9jJvzgz9ozBvvbiJfmLbw",
  authDomain: "teamdennisontracker.firebaseapp.com",
  projectId: "teamdennisontracker",
  storageBucket: "teamdennisontracker.firebasestorage.app",
  messagingSenderId: "915336870349",
  appId: "1:915336870349:web:c070e9b3fc0b688fe62c84"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const creaturesCol = collection(db, "creatures");

/* ============================================================
   CONFIG
   ============================================================ */
const ADMIN_PIN = "1234";          // change this
const IMG_PATH  = "./images/";     // where the outline PNGs live

// Friendly verb per scene, used in the title + button.
const VERBS = {
  butterfly:"fly",  ladybird:"fly",   bee:"fly",      frog:"hop",
  fish:"swim",      turtle:"swim",    jellyfish:"swim", shark:"swim",
  lion:"roam",      zebra:"roam",     rhino:"roam",    elephant:"roam",
  cat:"play",       dog:"play",       hamster:"play",  snake:"slither"
};

const EMOJI = {
  butterfly:"🦋", ladybird:"🐞", bee:"🐝", frog:"🐸",
  fish:"🐟", turtle:"🐢", jellyfish:"🪼", shark:"🦈",
  lion:"🦁", zebra:"🦓", rhino:"🦏", elephant:"🐘",
  cat:"🐱", dog:"🐶", hamster:"🐹", snake:"🐍"
};

const COLOURS = [
  "#e53935","#fb8c00","#fdd835","#43a047","#1e88e5",
  "#8e24aa","#ec407a","#6d4c41","#000000","#ffffff"
];

/* ============================================================
   ELEMENTS
   ============================================================ */
const canvas   = document.getElementById('paintCanvas');
const ctx      = canvas.getContext('2d', { willReadFrequently: true });
const wrap     = document.getElementById('paintWrap');
const palette  = document.getElementById('palette');
const sizeInp  = document.getElementById('brushSize');
const preview  = document.getElementById('brushPreview').firstElementChild;
const animalSel= document.getElementById('animalSelect');
const titleEl  = document.getElementById('titleText');
const sendBtn  = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');

/* ============================================================
   STATE
   ============================================================ */
let brushColour = COLOURS[0];
let brushSize   = parseInt(sizeInp.value, 10);
let painting    = false;

// Layered canvases held in memory:
let fillCanvas, fillCtx;   // where the child's colour actually goes
let outlineImg;            // the loaded PNG
let maskData = null;       // Uint8 per-pixel: 1 = inside the lines, paintable
let ready = false;         // true once an animal image + mask are built

/* ============================================================
   PALETTE
   ============================================================ */
COLOURS.forEach((c, i) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (i === 0 ? ' active' : '');
  s.style.background = c;
  if (c.toLowerCase() === '#ffffff') s.style.border = '3px solid #bbb';
  s.addEventListener('click', () => {
    brushColour = c;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
  });
  palette.appendChild(s);
});

function updatePreview() {
  preview.style.width  = brushSize + 'px';
  preview.style.height = brushSize + 'px';
}
sizeInp.addEventListener('input', () => {
  brushSize = parseInt(sizeInp.value, 10);
  updatePreview();
});
updatePreview();

/* ============================================================
   LOAD AN ANIMAL  (image-based, replaces the old vector code)
   ============================================================ */
function loadAnimal(name) {
  ready = false;
  sendBtn.disabled = true;
  statusEl.textContent = "Loading " + name + "…";

  const verb = VERBS[name] || "go";
  titleEl.textContent = "Paint your " + name + ", then let it " + verb + "!";
  sendBtn.textContent = "Send away! " + (EMOJI[name] || "✨");

  const img = new Image();
  img.crossOrigin = "anonymous";          // needed so we can read pixels
  img.onload = () => {
    outlineImg = img;

    // Build / resize the in-memory fill canvas to match the display canvas.
    fillCanvas = document.createElement('canvas');
    fillCanvas.width  = canvas.width;
    fillCanvas.height = canvas.height;
    fillCtx = fillCanvas.getContext('2d', { willReadFrequently: true });

    buildMask();
    redraw();

    ready = true;
    sendBtn.disabled = false;
    statusEl.textContent = "";
  };
  img.onerror = () => {
    statusEl.textContent = "Couldn't load " + name + ".png";
  };
  img.src = IMG_PATH + name + ".png";
}

/* ============================================================
   BUILD MASK
   Draw the outline once, then flood-fill from all four edges.
   Anything the flood can't reach (because the black outline blocks
   it) is "inside" the animal and therefore paintable.
   ============================================================ */
function buildMask() {
  const w = canvas.width, h = canvas.height;

  // Draw the outline, scaled to fit the canvas, into a temp context.
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const tctx = tmp.getContext('2d', { willReadFrequently: true });

  const scale = Math.min(w / outlineImg.width, h / outlineImg.height);
  const dw = outlineImg.width  * scale;
  const dh = outlineImg.height * scale;
  const dx = (w - dw) / 2;
  const dy = (h - dh) / 2;
  tctx.drawImage(outlineImg, dx, dy, dw, dh);

  const px = tctx.getImageData(0, 0, w, h).data;

  // line[i] = true where the outline is dark (a boundary the fill can't cross)
  const isLine = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const a = px[i * 4 + 3];
    const lum = (px[i*4] + px[i*4+1] + px[i*4+2]) / 3;
    if (a > 40 && lum < 110) isLine[i] = 1;
  }

  // Flood fill the "outside" starting from every edge pixel.
  const outside = new Uint8Array(w * h);
  const stack = [];
  for (let x = 0; x < w; x++) { stack.push(x); stack.push((h-1)*w + x); }
  for (let y = 0; y < h; y++) { stack.push(y*w); stack.push(y*w + (w-1)); }

  while (stack.length) {
    const i = stack.pop();
    if (i < 0 || i >= w*h) continue;
    if (outside[i] || isLine[i]) continue;
    outside[i] = 1;
    const x = i % w, y = (i / w) | 0;
    if (x > 0)   stack.push(i - 1);
    if (x < w-1) stack.push(i + 1);
    if (y > 0)   stack.push(i - w);
    if (y < h-1) stack.push(i + w);
  }

  // Paintable = not outside and not the line itself.
  maskData = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    maskData[i] = (!outside[i] && !isLine[i]) ? 1 : 0;
  }
}

/* ============================================================
   DRAW A BRUSH DAB (masked so it stays inside the lines)
   ============================================================ */
function dab(x, y) {
  if (!ready) return;
  const r = brushSize / 2;

  // Paint the dab onto the fill canvas.
  fillCtx.fillStyle = brushColour;
  fillCtx.beginPath();
  fillCtx.arc(x, y, r, 0, Math.PI * 2);
  fillCtx.fill();

  // Erase any part of the dab that fell outside the mask.
  const x0 = Math.max(0, Math.floor(x - r));
  const y0 = Math.max(0, Math.floor(y - r));
  const x1 = Math.min(canvas.width  - 1, Math.ceil(x + r));
  const y1 = Math.min(canvas.height - 1, Math.ceil(y + r));
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  if (bw <= 0 || bh <= 0) return;

  const img = fillCtx.getImageData(x0, y0, bw, bh);
  const d = img.data;
  for (let yy = 0; yy < bh; yy++) {
    for (let xx = 0; xx < bw; xx++) {
      const mi = (y0 + yy) * canvas.width + (x0 + xx);
      if (!maskData[mi]) {
        d[(yy * bw + xx) * 4 + 3] = 0;   // outside the lines -> transparent
      }
    }
  }
  fillCtx.putImageData(img, x0, y0);

  redraw();
}

/* ============================================================
   REDRAW: white bg -> child's fill -> black outline on top
   ============================================================ */
function redraw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  ctx.drawImage(fillCanvas, 0, 0);

  const scale = Math.min(w / outlineImg.width, h / outlineImg.height);
  const dw = outlineImg.width  * scale;
  const dh = outlineImg.height * scale;
  ctx.drawImage(outlineImg, (w - dw)/2, (h - dh)/2, dw, dh);
}

/* ============================================================
   POINTER HANDLING
   ============================================================ */
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width  / rect.width;
  const sy = canvas.height / rect.height;
  const p = e.touches ? e.touches[0] : e;
  return {
    x: (p.clientX - rect.left) * sx,
    y: (p.clientY - rect.top)  * sy
  };
}

let lastX, lastY;

function startPaint(e) {
  if (!ready) return;
  painting = true;
  const { x, y } = getPos(e);
  lastX = x; lastY = y;
  dab(x, y);
}

function movePaint(e) {
  if (!painting) return;
  e.preventDefault();
  const { x, y } = getPos(e);
  // Interpolate so fast strokes don't leave gaps.
  const dist = Math.hypot(x - lastX, y - lastY);
  const steps = Math.max(1, Math.floor(dist / (brushSize / 4)));
  for (let i = 1; i <= steps; i++) {
    dab(lastX + (x - lastX) * i / steps,
        lastY + (y - lastY) * i / steps);
  }
  lastX = x; lastY = y;
}

function endPaint() { painting = false; }

canvas.addEventListener('mousedown', startPaint);
canvas.addEventListener('mousemove', movePaint);
window.addEventListener('mouseup', endPaint);
canvas.addEventListener('touchstart', startPaint, { passive: false });
canvas.addEventListener('touchmove', movePaint, { passive: false });
canvas.addEventListener('touchend', endPaint);

/* ============================================================
   SAVE / SEND  →  Firestore
   ============================================================ */
function currentAnimal() { return animalSel.value; }

const HABITAT = {
  butterfly:"garden", ladybird:"garden", bee:"garden",   frog:"garden",
  fish:"aquarium",    turtle:"aquarium", jellyfish:"aquarium", shark:"aquarium",
  lion:"safari",      zebra:"safari",    rhino:"safari",  elephant:"safari",
  cat:"house",        dog:"house",       hamster:"house", snake:"house"
};

sendBtn.addEventListener('click', async () => {
  if (!ready) return;

  const animal  = currentAnimal();
  const habitat = HABITAT[animal] || "garden";
  const emoji   = EMOJI[animal] || "✨";

  // Export with transparent background so the aquarium scene shows through.
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width  = canvas.width;
  exportCanvas.height = canvas.height;
  const exportCtx = exportCanvas.getContext('2d');
  // 1. child's colour fill (already masked to inside-the-lines)
  exportCtx.drawImage(fillCanvas, 0, 0);
  // 2. black outline on top
  const scale = Math.min(canvas.width / outlineImg.width, canvas.height / outlineImg.height);
  const dw = outlineImg.width  * scale;
  const dh = outlineImg.height * scale;
  exportCtx.drawImage(outlineImg, (canvas.width - dw)/2, (canvas.height - dh)/2, dw, dh);
  const dataUrl = exportCanvas.toDataURL('image/png');

  sendBtn.disabled = true;
  statusEl.textContent = `Sending to the ${habitat}…`;

  try {
    await addDoc(creaturesCol, {
      img: dataUrl,
      animal,
      habitat,
      createdAt: serverTimestamp()
    });

    statusEl.textContent = `Off it goes! ${emoji}`;
    // Fresh canvas for the next child.
    fillCtx.clearRect(0, 0, fillCanvas.width, fillCanvas.height);
    redraw();

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Hmm, couldn't send. Try again.";
  } finally {
    sendBtn.disabled = false;
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
  }
});

animalSel.addEventListener('change', () => loadAnimal(animalSel.value));

/* ============================================================
   ADMIN  →  Firestore
   ============================================================ */
const adminToggle  = document.getElementById('adminToggle');
const adminPanel   = document.getElementById('adminPanel');
const adminPin     = document.getElementById('adminPin');
const unlockAdmin  = document.getElementById('unlockAdmin');
const pinArea      = document.getElementById('pinArea');
const adminTools   = document.getElementById('adminTools');
const adminStatus  = document.getElementById('adminStatus');
const adminList    = document.getElementById('adminList');

adminToggle.onclick = () => {
  adminPanel.style.display = "block";
};

document.getElementById('closeAdmin').onclick  = closeAdmin;
document.getElementById('closeAdmin2').onclick = closeAdmin;
function closeAdmin() { adminPanel.style.display = "none"; }

unlockAdmin.onclick = () => {
  if (adminPin.value === ADMIN_PIN) {
    pinArea.style.display  = "none";
    adminTools.style.display = "block";
    adminStatus.textContent = "Admin unlocked.";
  } else {
    adminStatus.textContent = "Wrong PIN.";
  }
};

async function deleteByQuery(q, label) {
  if (!confirm(`Are you sure you want to delete ${label}?`)) return;
  adminStatus.textContent = "Deleting…";
  const snap = await getDocs(q);
  await Promise.all(snap.docs.map(d => deleteDoc(doc(db, "creatures", d.id))));
  adminStatus.textContent = `Deleted ${snap.size} drawing(s).`;
  loadRecentDrawings();
}

document.getElementById('deleteAll').onclick = async () => {
  await deleteByQuery(query(creaturesCol), "ALL drawings");
};
document.getElementById('deleteGarden').onclick = async () => {
  await deleteByQuery(query(creaturesCol, where("habitat","==","garden")), "all garden drawings");
};
document.getElementById('deleteAquarium').onclick = async () => {
  await deleteByQuery(query(creaturesCol, where("habitat","==","aquarium")), "all aquarium drawings");
};
document.getElementById('deleteSafari').onclick = async () => {
  await deleteByQuery(query(creaturesCol, where("habitat","==","safari")), "all safari drawings");
};
document.getElementById('deleteHouse').onclick = async () => {
  await deleteByQuery(query(creaturesCol, where("habitat","==","house")), "all house drawings");
};
document.getElementById('loadRecent').onclick = loadRecentDrawings;

async function loadRecentDrawings() {
  adminStatus.textContent = "Loading recent drawings…";
  adminList.innerHTML = "";

  const q    = query(creaturesCol, orderBy("createdAt","desc"), limit(30));
  const snap = await getDocs(q);

  snap.forEach(d => {
    const data = d.data();

    const card = document.createElement("div");
    card.className = "adminCard";

    const img = document.createElement("img");
    img.src = data.img;

    const label = document.createElement("small");
    label.textContent = `${data.animal || "unknown"} / ${data.habitat || "unknown"}`;

    const respawnBtn = document.createElement("button");
    respawnBtn.textContent = "Respawn";
    respawnBtn.onclick = async () => {
      await addDoc(creaturesCol, {
        img: data.img,
        animal: data.animal,
        habitat: data.habitat,
        createdAt: serverTimestamp(),
        respawned: true
      });
      adminStatus.textContent = "Drawing respawned.";
    };

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "danger";
    deleteBtn.textContent = "Delete";
    deleteBtn.onclick = async () => {
      if (!confirm("Delete this drawing?")) return;
      await deleteDoc(doc(db, "creatures", d.id));
      adminStatus.textContent = "Drawing deleted.";
      loadRecentDrawings();
    };

    card.appendChild(img);
    card.appendChild(label);
    card.appendChild(respawnBtn);
    card.appendChild(deleteBtn);
    adminList.appendChild(card);
  });

  adminStatus.textContent = `Loaded ${snap.size} drawing(s).`;
}

/* ============================================================
   START
   ============================================================ */
loadAnimal(animalSel.value);
</script>
