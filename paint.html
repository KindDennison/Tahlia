<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paint an Animal</title>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    background: #f4f1e0;
  }

  #paintPanel {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vmin;
  }

  h1 {
    font-size: clamp(1.1em, 3.2vmin, 2.4em);
    color: #33691e;
    margin: 1vmin 0;
    text-align: center;
  }

  #topControls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1vmin;
    margin-bottom: 1vmin;
  }

  select, button, input {
    font-family: inherit;
  }

  select {
    font-size: clamp(.9em, 2vmin, 1.2em);
    padding: .7vmin 1.2vmin;
    border-radius: 12px;
    border: 2px solid #b7b7b7;
    background: #fff;
  }

  #paintWrap {
    position: relative;
    touch-action: none;
  }

  #paintCanvas {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    display: block;
  }

  #palette {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5vmin;
    margin: 2vmin 0 1vmin;
    max-width: 90vmin;
  }

  .swatch {
    width: 6vmin;
    height: 6vmin;
    min-width: 36px;
    min-height: 36px;
    max-width: 60px;
    max-height: 60px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
    cursor: pointer;
  }

  .swatch.active {
    border-color: #333;
    transform: scale(1.18);
  }

  #brushRow {
    display: flex;
    align-items: center;
    gap: 2vmin;
    margin: 1vmin 0 2vmin;
  }

  #brushRow label {
    font-size: clamp(.9em, 2.2vmin, 1.4em);
    color: #555;
  }

  #brushSize {
    width: 40vmin;
    max-width: 320px;
  }

  #brushPreview {
    width: 7vmin;
    height: 7vmin;
    max-width: 56px;
    max-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #brushPreview div {
    background: #333;
    border-radius: 50%;
  }

  #sendBtn {
    font-size: clamp(1.1em, 3vmin, 2em);
    font-weight: bold;
    color: #fff;
    background: #ff7043;
    border: none;
    padding: 2vmin 5vmin;
    border-radius: 40px;
    box-shadow: 0 4px 0 #d84315;
    cursor: pointer;
  }

  #sendBtn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #d84315;
  }

  #sendBtn:disabled {
    opacity: .5;
  }

  #status {
    height: 3vmin;
    font-size: clamp(.8em, 2vmin, 1.2em);
    color: #777;
    margin-top: 1vmin;
  }

  #adminToggle {
    position: fixed;
    right: 10px;
    bottom: 10px;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 18px;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    cursor: pointer;
    z-index: 20;
  }

  #adminPanel {
    display: none;
    position: fixed;
    inset: 3vmin;
    background: rgba(255,255,255,.96);
    z-index: 30;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    padding: 18px;
    overflow: auto;
    font-family: "Segoe UI", sans-serif;
  }

  #adminPanel h2 {
    margin-top: 0;
    color: #333;
  }

  .adminRow {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0;
    align-items: center;
  }

  .adminRow button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    background: #455a64;
    color: #fff;
    cursor: pointer;
  }

  .adminRow button.danger {
    background: #c62828;
  }

  .adminRow button.good {
    background: #2e7d32;
  }

  #adminList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    margin-top: 14px;
  }

  .adminCard {
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #fafafa;
    padding: 8px;
    text-align: center;
  }

  .adminCard img {
    width: 100%;
    height: 100px;
    object-fit: contain;
    background: #fff;
    border-radius: 8px;
  }

  .adminCard small {
    display: block;
    color: #555;
    margin: 4px 0 8px;
  }

  .adminCard button {
    width: 100%;
    margin-top: 4px;
    padding: 7px;
    border: none;
    border-radius: 8px;
    color: #fff;
    background: #1976d2;
    cursor: pointer;
  }

  .adminCard button.danger {
    background: #c62828;
  }
</style>
</head>

<body>

<div id="paintPanel">
  <h1 id="titleText">Paint your butterfly, then let it fly!</h1>

  <div id="topControls">
    <select id="animalSelect">
      <optgroup label="Garden">
        <option value="butterfly">Butterfly</option>
        <option value="ladybird">Ladybird</option>
        <option value="bee">Bee</option>
        <option value="frog">Frog</option>
      </optgroup>
      <optgroup label="Aquarium">
        <option value="fish">Fish</option>
        <option value="turtle">Turtle</option>
        <option value="jellyfish">Jellyfish</option>
        <option value="shark">Shark</option>
      </optgroup>
      <optgroup label="Safari">
        <option value="lion">Lion</option>
        <option value="zebra">Zebra</option>
        <option value="rhino">Rhino</option>
        <option value="elephant">Elephant</option>
      </optgroup>
      <optgroup label="House">
        <option value="cat">Cat</option>
        <option value="dog">Dog</option>
        <option value="hamster">Hamster</option>
        <option value="snake">Snake</option>
      </optgroup>
    </select>
  </div>

  <div id="paintWrap">
    <canvas id="paintCanvas" width="320" height="300"></canvas>
  </div>

  <div id="palette"></div>

  <div id="brushRow">
    <label for="brushSize">Brush</label>
    <input type="range" id="brushSize" min="6" max="40" value="16">
    <div id="brushPreview"><div></div></div>
  </div>

  <button id="sendBtn">Send away! 🦋</button>
  <div id="status"></div>
</div>

<button id="adminToggle">Admin</button>

<div id="adminPanel">
  <h2>Admin Area</h2>

  <div id="pinArea" class="adminRow">
    <input id="adminPin" type="password" placeholder="PIN">
    <button id="unlockAdmin">Unlock</button>
    <button id="closeAdmin">Close</button>
  </div>

  <div id="adminTools" style="display:none;">
    <div class="adminRow">
      <button id="loadRecent" class="good">Load recent drawings</button>
      <button id="deleteGarden" class="danger">Delete garden drawings</button>
      <button id="deleteAquarium" class="danger">Delete aquarium drawings</button>
      <button id="deleteSafari" class="danger">Delete safari drawings</button>
      <button id="deleteHouse" class="danger">Delete house drawings</button>
      <button id="deleteAll" class="danger">Delete ALL drawings</button>
      <button id="closeAdmin2">Close</button>
    </div>

    <div id="adminStatus"></div>
    <div id="adminList"></div>
  </div>
</div>

<script type="module">
/* ================== FIREBASE ================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  getDocs,
  deleteDoc,
  doc,
  query,
  where,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJXVZE2VZXPH9jJvzgz9ozBvvbiJfmLbw",
  authDomain: "teamdennisontracker.firebaseapp.com",
  projectId: "teamdennisontracker",
  storageBucket: "teamdennisontracker.firebasestorage.app",
  messagingSenderId: "915336870349",
  appId: "1:915336870349:web:c070e9b3fc0b688fe62c84"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const creaturesCol = collection(db, "creatures");

/* ================== SETTINGS ================== */
const ADMIN_PIN = "1234";

const animalMeta = {
  butterfly: { label: "butterfly", habitat: "garden", emoji: "🦋", action: "Fly away" },
  ladybird:  { label: "ladybird",  habitat: "garden", emoji: "🐞", action: "Crawl away" },
  bee:       { label: "bee",       habitat: "garden", emoji: "🐝", action: "Buzz away" },
  frog:      { label: "frog",      habitat: "garden", emoji: "🐸", action: "Hop away" },
  fish:      { label: "fish",      habitat: "aquarium", emoji: "🐟", action: "Swim away" },
  turtle:    { label: "turtle",    habitat: "aquarium", emoji: "🐢", action: "Swim away" },
  jellyfish: { label: "jellyfish", habitat: "aquarium", emoji: "🪼", action: "Float away" },
  shark:     { label: "shark",     habitat: "aquarium", emoji: "🦈", action: "Swim away" },
  lion:      { label: "lion",      habitat: "safari",   emoji: "🦁", action: "Roar away" },
  zebra:     { label: "zebra",     habitat: "safari",   emoji: "🦓", action: "Gallop away" },
  rhino:     { label: "rhino",     habitat: "safari",   emoji: "🦏", action: "Charge away" },
  elephant:  { label: "elephant",  habitat: "safari",   emoji: "🐘", action: "Trumpet away" },
  cat:       { label: "cat",       habitat: "house",    emoji: "🐱", action: "Pounce away" },
  dog:       { label: "dog",       habitat: "house",    emoji: "🐶", action: "Run away" },
  hamster:   { label: "hamster",   habitat: "house",    emoji: "🐹", action: "Scurry away" },
  snake:     { label: "snake",     habitat: "house",    emoji: "🐍", action: "Slither away" }
};

let currentAnimal = "butterfly";

/* ================== CANVAS ================== */
const pc = document.getElementById('paintCanvas');
const px = pc.getContext('2d');

const fill = document.createElement('canvas');
fill.width = pc.width;
fill.height = pc.height;
const fx = fill.getContext('2d');

function fitCanvas(){
  const panel = document.getElementById('paintPanel');
  const others = panel.clientHeight
    - document.querySelector('h1').offsetHeight
    - document.getElementById('topControls').offsetHeight
    - document.getElementById('palette').offsetHeight
    - document.getElementById('brushRow').offsetHeight
    - document.getElementById('sendBtn').offsetHeight
    - document.getElementById('status').offsetHeight
    - 70;

  const maxH = Math.max(150, others);
  const maxW = panel.clientWidth - 24;
  const ratio = 320 / 300;

  let w = maxW;
  let h = w / ratio;

  if (h > maxH) {
    h = maxH;
    w = h * ratio;
  }

  pc.style.width = w + 'px';
  pc.style.height = h + 'px';
}

window.addEventListener('resize', fitCanvas);

/* ================== PALETTE ================== */
const colours = [
  "#e53935",
  "#fb8c00",
  "#fdd835",
  "#43a047",
  "#1e88e5",
  "#8e24aa",
  "#ec407a",
  "#00acc1",
  "#6d4c41",
  "#000000",
  "#ffffff"
];

let currentColour = colours[5];

const palette = document.getElementById('palette');

colours.forEach((c) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (c === currentColour ? ' active' : '');
  s.style.background = c;

  s.onclick = () => {
    currentColour = c;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    updateBrushPreview();
  };

  palette.appendChild(s);
});

/* ================== BRUSH ================== */
const brushSizeEl = document.getElementById('brushSize');
const brushPrev = document.querySelector('#brushPreview div');
let brushSize = Number(brushSizeEl.value);

function updateBrushPreview(){
  brushPrev.style.width = brushSize + 'px';
  brushPrev.style.height = brushSize + 'px';
  brushPrev.style.background = currentColour === '#ffffff' ? '#ccc' : currentColour;
}

brushSizeEl.addEventListener('input', () => {
  brushSize = Number(brushSizeEl.value);
  updateBrushPreview();
});

/* ================== CREATURE PATHS ================== */
function creaturePath(ctx){
  const cx = 160;
  const cy = 150;

  ctx.beginPath();

  if (currentAnimal === "butterfly") {
    // Cleaner symmetrical butterfly
    ctx.moveTo(cx, cy - 95);
    ctx.bezierCurveTo(cx - 18, cy - 75, cx - 18, cy - 25, cx, cy - 5);
    ctx.bezierCurveTo(cx + 18, cy - 25, cx + 18, cy - 75, cx, cy - 95);

    ctx.moveTo(cx - 6, cy - 10);
    ctx.bezierCurveTo(cx - 120, cy - 115, cx - 155, cy - 15, cx - 68, cy + 28);
    ctx.bezierCurveTo(cx - 48, cy + 38, cx - 28, cy + 18, cx - 12, cy + 2);

    ctx.moveTo(cx - 6, cy - 10);
    ctx.bezierCurveTo(cx - 110, cy + 18, cx - 95, cy + 120, cx - 18, cy + 70);
    ctx.bezierCurveTo(cx - 2, cy + 60, cx + 6, cy + 18, cx - 6, cy - 10);

    ctx.moveTo(cx + 6, cy - 10);
    ctx.bezierCurveTo(cx + 120, cy - 115, cx + 155, cy - 15, cx + 68, cy + 28);
    ctx.bezierCurveTo(cx + 48, cy + 38, cx + 28, cy + 18, cx + 12, cy + 2);

    ctx.moveTo(cx + 6, cy - 10);
    ctx.bezierCurveTo(cx + 110, cy + 18, cx + 95, cy + 120, cx + 18, cy + 70);
    ctx.bezierCurveTo(cx + 2, cy + 60, cx - 6, cy + 18, cx + 6, cy - 10);
  }

  else if (currentAnimal === "ladybird") {
    // Rounded beetle body
    ctx.ellipse(cx, cy + 8, 92, 82, 0, 0, Math.PI * 2);
    ctx.moveTo(cx, cy - 74);
    ctx.arc(cx, cy - 74, 26, 0, Math.PI * 2);
  }

  else if (currentAnimal === "bee") {
    // Better bee proportions
    ctx.ellipse(cx - 5, cy + 8, 92, 58, 0, 0, Math.PI * 2);
    ctx.moveTo(cx - 96, cy + 8);
    ctx.arc(cx - 121, cy + 4, 24, 0, Math.PI * 2);
    ctx.moveTo(cx + 5, cy - 60);
    ctx.ellipse(cx + 18, cy - 72, 48, 30, -0.35, 0, Math.PI * 2);
    ctx.moveTo(cx - 6, cy - 56);
    ctx.ellipse(cx - 18, cy - 68, 42, 24, -0.4, 0, Math.PI * 2);
  }

  else if (currentAnimal === "frog") {
    // Frog with squat body and big eyes
    ctx.ellipse(cx, cy + 20, 92, 70, 0, 0, Math.PI * 2);
    ctx.moveTo(cx - 48, cy - 52);
    ctx.arc(cx - 48, cy - 52, 24, 0, Math.PI * 2);
    ctx.moveTo(cx + 48, cy - 52);
    ctx.arc(cx + 48, cy - 52, 24, 0, Math.PI * 2);

    ctx.moveTo(cx - 84, cy + 78);
    ctx.bezierCurveTo(cx - 124, cy + 88, cx - 130, cy + 122, cx - 98, cy + 122);
    ctx.bezierCurveTo(cx - 68, cy + 122, cx - 58, cy + 94, cx - 68, cy + 82);

    ctx.moveTo(cx + 84, cy + 78);
    ctx.bezierCurveTo(cx + 124, cy + 88, cx + 130, cy + 122, cx + 98, cy + 122);
    ctx.bezierCurveTo(cx + 68, cy + 122, cx + 58, cy + 94, cx + 68, cy + 82);
  }

  else if (currentAnimal === "fish") {
    // Proper fish silhouette
    ctx.moveTo(cx - 72, cy);
    ctx.bezierCurveTo(cx - 40, cy - 70, cx + 90, cy - 70, cx + 120, cy);
    ctx.bezierCurveTo(cx + 90, cy + 70, cx - 40, cy + 70, cx - 72, cy);

    ctx.moveTo(cx - 72, cy);
    ctx.lineTo(cx - 134, cy - 52);
    ctx.lineTo(cx - 118, cy);
    ctx.lineTo(cx - 134, cy + 52);
    ctx.closePath();

    ctx.moveTo(cx + 12, cy - 65);
    ctx.bezierCurveTo(cx + 30, cy - 102, cx + 66, cy - 95, cx + 74, cy - 62);
    ctx.moveTo(cx + 26, cy + 20);
    ctx.bezierCurveTo(cx + 40, cy + 56, cx + 72, cy + 56, cx + 84, cy + 18);
  }

  else if (currentAnimal === "turtle") {
    // Turtle with shell and head
    ctx.ellipse(cx - 10, cy + 8, 88, 62, 0, 0, Math.PI * 2);
    ctx.moveTo(cx + 74, cy - 18);
    ctx.bezierCurveTo(cx + 110, cy - 42, cx + 140, cy - 20, cx + 132, cy + 6);
    ctx.bezierCurveTo(cx + 126, cy + 26, cx + 96, cy + 26, cx + 82, cy + 12);
    ctx.bezierCurveTo(cx + 72, cy + 2, cx + 68, cy - 10, cx + 74, cy - 18);

    ctx.moveTo(cx - 54, cy - 54);
    ctx.ellipse(cx - 82, cy - 54, 22, 14, -0.25, 0, Math.PI * 2);
    ctx.moveTo(cx - 56, cy + 58);
    ctx.ellipse(cx - 82, cy + 60, 22, 14, 0.25, 0, Math.PI * 2);
    ctx.moveTo(cx + 40, cy - 46);
    ctx.ellipse(cx + 60, cy - 48, 20, 13, 0.25, 0, Math.PI * 2);
    ctx.moveTo(cx + 38, cy + 58);
    ctx.ellipse(cx + 60, cy + 60, 20, 13, -0.25, 0, Math.PI * 2);
  }

  else if (currentAnimal === "jellyfish") {
    // Smooth jellyfish dome and tentacles
    ctx.moveTo(cx - 82, cy - 2);
    ctx.bezierCurveTo(cx - 72, cy - 102, cx + 72, cy - 102, cx + 82, cy - 2);
    ctx.bezierCurveTo(cx + 55, cy + 30, cx + 28, cy + 18, cx, cy + 2);
    ctx.bezierCurveTo(cx - 28, cy + 18, cx - 55, cy + 30, cx - 82, cy - 2);

    ctx.moveTo(cx - 46, cy + 10);
    ctx.bezierCurveTo(cx - 60, cy + 52, cx - 46, cy + 86, cx - 58, cy + 124);
    ctx.moveTo(cx - 16, cy + 10);
    ctx.bezierCurveTo(cx - 30, cy + 52, cx - 16, cy + 92, cx - 26, cy + 126);
    ctx.moveTo(cx + 16, cy + 10);
    ctx.bezierCurveTo(cx + 30, cy + 52, cx + 16, cy + 92, cx + 26, cy + 126);
    ctx.moveTo(cx + 46, cy + 10);
    ctx.bezierCurveTo(cx + 60, cy + 52, cx + 46, cy + 86, cx + 58, cy + 124);
  }

  else if (currentAnimal === "shark") {
    // Cleaner shark profile
    ctx.moveTo(cx - 118, cy + 10);
    ctx.bezierCurveTo(cx - 92, cy - 72, cx + 72, cy - 92, cx + 132, cy - 10);
    ctx.bezierCurveTo(cx + 146, cy + 10, cx + 138, cy + 32, cx + 112, cy + 42);
    ctx.bezierCurveTo(cx + 50, cy + 70, cx - 72, cy + 70, cx - 118, cy + 10);

    ctx.moveTo(cx - 24, cy - 46);
    ctx.lineTo(cx + 8, cy - 110);
    ctx.lineTo(cx + 26, cy - 42);

    ctx.moveTo(cx + 4, cy + 20);
    ctx.lineTo(cx - 8, cy + 86);
    ctx.lineTo(cx + 36, cy + 28);

    ctx.moveTo(cx + 44, cy - 32);
    ctx.bezierCurveTo(cx + 32, cy - 8, cx + 32, cy + 10, cx + 46, cy + 34);
  }

  else if (currentAnimal === "lion") {
    // Round lion with mane
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const mx = cx + Math.cos(a) * 94;
      const my = cy + Math.sin(a) * 88;
      ctx.moveTo(mx, my);
      ctx.arc(mx, my, 18, 0, Math.PI * 2);
    }

    ctx.moveTo(cx + 54, cy + 6);
    ctx.ellipse(cx, cy + 6, 58, 54, 0, 0, Math.PI * 2);

    ctx.moveTo(cx - 42, cy - 58);
    ctx.arc(cx - 48, cy - 64, 14, 0, Math.PI * 2);
    ctx.moveTo(cx + 42, cy - 58);
    ctx.arc(cx + 48, cy - 64, 14, 0, Math.PI * 2);
  }

  else if (currentAnimal === "zebra") {
    // Standing zebra body
    ctx.moveTo(cx - 78, cy - 18);
    ctx.bezierCurveTo(cx - 58, cy - 78, cx + 42, cy - 82, cx + 72, cy - 26);
    ctx.bezierCurveTo(cx + 88, cy + 8, cx + 84, cy + 72, cx + 54, cy + 82);
    ctx.bezierCurveTo(cx - 6, cy + 102, cx - 84, cy + 82, cx - 88, cy + 30);
    ctx.bezierCurveTo(cx - 90, cy + 8, cx - 86, cy - 4, cx - 78, cy - 18);

    ctx.moveTo(cx + 52, cy - 24);
    ctx.bezierCurveTo(cx + 92, cy - 42, cx + 112, cy - 18, cx + 102, cy + 10);
    ctx.bezierCurveTo(cx + 92, cy + 30, cx + 70, cy + 26, cx + 60, cy + 12);
    ctx.bezierCurveTo(cx + 52, cy + 2, cx + 48, cy - 12, cx + 52, cy - 24);

    ctx.moveTo(cx + 18, cy - 72);
    ctx.bezierCurveTo(cx + 20, cy - 110, cx + 28, cy - 130, cx + 42, cy - 142);
    ctx.moveTo(cx + 42, cy - 142);
    ctx.lineTo(cx + 36, cy - 118);
    ctx.moveTo(cx + 62, cy - 140);
    ctx.lineTo(cx + 62, cy - 114);
    ctx.moveTo(cx - 52, cy + 78);
    ctx.lineTo(cx - 52, cy + 140);
    ctx.moveTo(cx - 22, cy + 82);
    ctx.lineTo(cx - 22, cy + 142);
    ctx.moveTo(cx + 22, cy + 82);
    ctx.lineTo(cx + 22, cy + 142);
    ctx.moveTo(cx + 52, cy + 78);
    ctx.lineTo(cx + 52, cy + 138);

    ctx.moveTo(cx - 88, cy + 18);
    ctx.bezierCurveTo(cx - 118, cy + 14, cx - 130, cy + 44, cx - 116, cy + 72);
  }

  else if (currentAnimal === "rhino") {
    // Chunky rhino with horn
    ctx.moveTo(cx - 82, cy - 6);
    ctx.bezierCurveTo(cx - 62, cy - 72, cx + 36, cy - 78, cx + 74, cy - 46);
    ctx.bezierCurveTo(cx + 118, cy - 10, cx + 118, cy + 62, cx + 82, cy + 84);
    ctx.bezierCurveTo(cx + 26, cy + 118, cx - 72, cy + 104, cx - 96, cy + 48);
    ctx.bezierCurveTo(cx - 110, cy + 16, cx - 100, cy - 2, cx - 82, cy - 6);

    ctx.moveTo(cx + 58, cy - 38);
    ctx.bezierCurveTo(cx + 92, cy - 70, cx + 126, cy - 48, cx + 120, cy - 16);
    ctx.bezierCurveTo(cx + 114, cy + 10, cx + 88, cy + 12, cx + 70, cy + 2);

    ctx.moveTo(cx + 96, cy - 56);
    ctx.lineTo(cx + 126, cy - 92);
    ctx.lineTo(cx + 112, cy - 52);

    ctx.moveTo(cx - 48, cy + 80);
    ctx.lineTo(cx - 48, cy + 144);
    ctx.moveTo(cx - 10, cy + 84);
    ctx.lineTo(cx - 10, cy + 146);
    ctx.moveTo(cx + 28, cy + 82);
    ctx.lineTo(cx + 28, cy + 144);
    ctx.moveTo(cx + 62, cy + 74);
    ctx.lineTo(cx + 62, cy + 138);
  }

  else if (currentAnimal === "elephant") {
    // Better elephant with trunk and big ears
    ctx.ellipse(cx - 6, cy + 12, 88, 66, 0, 0, Math.PI * 2);

    ctx.moveTo(cx + 40, cy - 46);
    ctx.bezierCurveTo(cx + 104, cy - 92, cx + 138, cy - 8, cx + 96, cy + 28);
    ctx.bezierCurveTo(cx + 130, cy + 8, cx + 150, cy - 68, cx + 96, cy - 84);

    ctx.moveTo(cx + 10, cy - 36);
    ctx.bezierCurveTo(cx + 42, cy - 44, cx + 52, cy - 8, cx + 50, cy + 22);
    ctx.bezierCurveTo(cx + 48, cy + 54, cx + 68, cy + 74, cx + 82, cy + 112);
    ctx.bezierCurveTo(cx + 90, cy + 138, cx + 72, cy + 154, cx + 56, cy + 146);

    ctx.moveTo(cx - 56, cy + 74);

    ctx.moveTo(cx - 20, cy + 78);
    ctx.lineTo(cx - 20, cy + 146);
    ctx.moveTo(cx + 18, cy + 76);

  }

  else if (currentAnimal === "cat") {

    ctx.moveTo(cx - 62, cy + 74);
    ctx.bezierCurveTo(cx - 74, cy + 20, cx - 60, cy - 18, cx - 34, cy - 32);
    ctx.bezierCurveTo(cx - 22, cy - 38, cx - 18, cy - 28, cx - 12, cy - 32);
    ctx.arc(cx, cy - 46, 44, Math.PI * 1.05, Math.PI * 1.95, false);
    ctx.bezierCurveTo(cx + 54, cy - 30, cx + 72, cy + 8, cx + 68, cy + 74);
    ctx.bezierCurveTo(cx + 42, cy + 92, cx - 42, cy + 92, cx - 62, cy + 74);

    ctx.moveTo(cx - 42, cy - 84);
    ctx.lineTo(cx - 58, cy - 118);
    ctx.lineTo(cx - 20, cy - 94);
    ctx.moveTo(cx + 42, cy - 84);
    ctx.lineTo(cx + 58, cy - 118);
    ctx.lineTo(cx + 20, cy - 94);

    ctx.moveTo(cx + 62, cy + 72);
    ctx.bezierCurveTo(cx + 108, cy + 82, cx + 118, cy + 38, cx + 102, cy + 8);

  else if (currentAnimal === "dog") {
    // Friendly dog
    ctx.ellipse(cx - 8, cy + 28, 78, 58, 0, 0, Math.PI * 2);

    ctx.moveTo(cx + 42, cy - 44);
    ctx.arc(cx + 16, cy - 46, 48, 0, Math.PI * 2);

    ctx.moveTo(cx - 18, cy - 90);
    ctx.bezierCurveTo(cx - 42, cy - 96, cx - 72, cy - 74, cx - 68, cy - 40);
    ctx.bezierCurveTo(cx - 64, cy - 12, cx - 40, cy - 10, cx - 28, cy - 24);

    ctx.moveTo(cx + 52, cy - 90);
    ctx.bezierCurveTo(cx + 72, cy - 100, cx + 104, cy - 80, cx + 102, cy - 46);
    ctx.bezierCurveTo(cx + 100, cy - 16, cx + 80, cy - 8, cx + 66, cy - 20);

    ctx.moveTo(cx - 44, cy + 78);
    ctx.lineTo(cx - 44, cy + 144);
    ctx.moveTo(cx - 10, cy + 84);
    ctx.lineTo(cx - 10, cy + 148);

    ctx.moveTo(cx + 58, cy + 76);

  else if (currentAnimal === "hamster") {
    // Round hamster with cheeks
    ctx.ellipse(cx, cy + 22, 86, 74, 0, 0, Math.PI * 2);
    ctx.moveTo(cx, cy - 52);

    ctx.moveTo(cx - 42, cy - 92);

    ctx.moveTo(cx + 42, cy - 92);

    ctx.moveTo(cx - 58, cy - 28);
    ctx.arc(cx - 70, cy - 18, 20, 0, Math.PI * 2);
    ctx.moveTo(cx + 58, cy - 28);

  else if (currentAnimal === "snake") {

    ctx.moveTo(cx - 136, cy + 58);

    ctx.bezierCurveTo(cx + 50, cy + 24, cx + 76, cy + 54, cx + 122, cy + 22);
    ctx.bezierCurveTo(cx + 168, cy - 10, cx + 176, cy - 78, cx + 120, cy - 102);
    ctx.bezierCurveTo(cx + 88, cy - 116, cx + 62, cy - 100, cx + 52, cy - 78);
    ctx.bezierCurveTo(cx + 42, cy - 56, cx + 52, cy - 32, cx + 74, cy - 18);
  }

  else {
    ctx.ellipse(cx, cy, 70, 50, 0, 0, Math.PI * 2);
  }
}

function drawCreatureDetails(ctx){
  const cx = 160;
  const cy = 150;

  ctx.lineWidth = 4;
  ctx.strokeStyle = "#333";
  ctx.fillStyle = "#333";

  function eye(x, y, r){
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#333";
  }

  if (currentAnimal === "butterfly") {
    ctx.beginPath();
    ctx.ellipse(cx, cy + 28, 8, 58, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy - 34, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx - 2, cy - 42);
    ctx.quadraticCurveTo(cx - 28, cy - 76, cx - 34, cy - 82);
    ctx.moveTo(cx + 2, cy - 42);
    ctx.quadraticCurveTo(cx + 28, cy - 76, cx + 34, cy - 82);
    ctx.stroke();
  }

  if (currentAnimal === "ladybird") {
    ctx.beginPath();
    ctx.moveTo(cx, cy - 66);
    ctx.lineTo(cx, cy + 88);
    ctx.stroke();
    for (const [x, y] of [[-36,-20],[36,-20],[-46,24],[46,24],[-24,62],[24,62]]) {
      ctx.beginPath();
      ctx.arc(cx + x, cy + y, 12, 0, Math.PI * 2);
      ctx.fill();
    }
    eye(cx - 12, cy - 72, 4.5);
    eye(cx + 12, cy - 72, 4.5);
  }

  if (currentAnimal === "bee") {
    ctx.lineWidth = 14;
    for (let x = cx - 30; x <= cx + 50; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, cy - 46);
      ctx.lineTo(x, cy + 54);
      ctx.stroke();
    }
    ctx.lineWidth = 4;
    eye(cx - 118, cy - 2, 4.5);
    ctx.beginPath();
    ctx.moveTo(cx + 98, cy + 10);
    ctx.lineTo(cx + 120, cy + 4);
    ctx.stroke();
  }

  if (currentAnimal === "frog") {
    eye(cx - 48, cy - 52, 10);
    eye(cx + 48, cy - 52, 10);
    ctx.beginPath();
    ctx.arc(cx, cy + 18, 38, 0.2, Math.PI - 0.2);
    ctx.stroke();
  }

  if (currentAnimal === "fish") {
    eye(cx + 68, cy - 10, 6);
    ctx.beginPath();
    ctx.moveTo(cx - 20, cy - 50);
    ctx.lineTo(cx - 20, cy + 50);
    ctx.moveTo(cx + 8, cy - 58);
    ctx.lineTo(cx + 8, cy + 58);
    ctx.stroke();
  }

  if (currentAnimal === "turtle") {
    eye(cx + 98, cy - 20, 5);
    ctx.beginPath();
    ctx.moveTo(cx - 52, cy + 5);
    ctx.lineTo(cx + 34, cy + 5);
    ctx.moveTo(cx - 10, cy - 35);
    ctx.lineTo(cx - 10, cy + 45);
    ctx.stroke();
  }

  if (currentAnimal === "jellyfish") {
    eye(cx - 18, cy - 34, 5);
    eye(cx + 18, cy - 34, 5);
  }

  if (currentAnimal === "shark") {
    eye(cx + 108, cy - 4, 6);
    ctx.beginPath();
    ctx.moveTo(cx - 48, cy - 30);
    ctx.lineTo(cx - 20, cy - 5);
    ctx.lineTo(cx - 48, cy + 20);
    ctx.stroke();
  }

  if (currentAnimal === "lion") {
    eye(cx - 20, cy - 14, 6);
    eye(cx + 20, cy - 14, 6);
    ctx.beginPath();
    ctx.arc(cx, cy + 4, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 16, cy + 18);
    ctx.bezierCurveTo(cx - 4, cy + 28, cx + 4, cy + 28, cx + 16, cy + 18);
    ctx.stroke();
  }

  if (currentAnimal === "zebra") {
    eye(cx + 52, cy - 68, 5);
    ctx.beginPath();
    ctx.arc(cx + 72, cy - 52, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  if (currentAnimal === "rhino") {
    eye(cx + 72, cy - 26, 5);
    ctx.beginPath();
    ctx.arc(cx + 118, cy + 4, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  if (currentAnimal === "elephant") {
    eye(cx + 70, cy - 34, 6);
    ctx.beginPath();
    ctx.moveTo(cx + 34, cy - 6);
    ctx.bezierCurveTo(cx + 48, cy + 18, cx + 50, cy + 54, cx + 42, cy + 86);
    ctx.stroke();
  }

  if (currentAnimal === "cat") {
    eye(cx - 18, cy - 56, 6);
    eye(cx + 18, cy - 56, 6);
    ctx.beginPath();
    ctx.moveTo(cx - 10, cy - 32);
    ctx.lineTo(cx, cy - 24);
    ctx.lineTo(cx + 10, cy - 32);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy - 22);
    ctx.lineTo(cx - 42, cy - 18);
    ctx.moveTo(cx + 12, cy - 22);
    ctx.lineTo(cx + 42, cy - 18);
    ctx.stroke();
  }

  if (currentAnimal === "dog") {
    eye(cx + 36, cy - 58, 6);
    eye(cx + 66, cy - 58, 6);
    ctx.beginPath();
    ctx.arc(cx + 52, cy - 34, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  if (currentAnimal === "hamster") {
    eye(cx - 18, cy - 46, 6);
    eye(cx + 18, cy - 46, 6);
    ctx.beginPath();
    ctx.arc(cx, cy - 28, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  if (currentAnimal === "snake") {
    eye(cx + 40, cy + 56, 4.5);
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy + 86);
    ctx.lineTo(cx - 24, cy + 80);
    ctx.moveTo(cx - 8, cy + 86);
    ctx.lineTo(cx - 24, cy + 92);
    ctx.stroke();
  }
}

function render(forExport = false){
  px.clearRect(0, 0, pc.width, pc.height);

  if (!forExport) {
    px.fillStyle = "#fff";
    px.fillRect(0, 0, pc.width, pc.height);
  }

  px.drawImage(fill, 0, 0);

  px.lineWidth = 4;
  px.strokeStyle = "#333";
  creaturePath(px);
  px.stroke();

  drawCreatureDetails(px);
}

/* ================== PAINTING ================== */
let painting = false;

function paintAt(x, y){
  fx.save();
  creaturePath(fx);
  fx.clip();

  fx.fillStyle = currentColour;
  fx.beginPath();
  fx.arc(x, y, brushSize, 0, Math.PI * 2);
  fx.fill();

  fx.restore();
  render();
}

function pos(e){
  const r = pc.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;

  return {
    x: (t.clientX - r.left) * (pc.width / r.width),
    y: (t.clientY - r.top) * (pc.height / r.height)
  };
}

function down(e){
  painting = true;
  const p = pos(e);
  paintAt(p.x, p.y);
  e.preventDefault();
}

function move(e){
  if (painting) {
    const p = pos(e);
    paintAt(p.x, p.y);
    e.preventDefault();
  }
}

function up(){
  painting = false;
}

pc.addEventListener('mousedown', down);
pc.addEventListener('mousemove', move);
window.addEventListener('mouseup', up);

pc.addEventListener('touchstart', down, { passive:false });
pc.addEventListener('touchmove', move, { passive:false });
pc.addEventListener('touchend', up);

/* ================== ANIMAL CHANGE ================== */
const animalSelect = document.getElementById('animalSelect');
const titleText = document.getElementById('titleText');
const sendBtn = document.getElementById('sendBtn');

function updateAnimalText(){
  const m = animalMeta[currentAnimal];
  titleText.textContent = `Paint your ${m.label}, then send it away!`;
  sendBtn.textContent = `${m.action}! ${m.emoji}`;
}

animalSelect.addEventListener('change', () => {
  currentAnimal = animalSelect.value;
  fx.clearRect(0, 0, fill.width, fill.height);
  updateAnimalText();
  render();
});

/* ================== SEND TO FIRESTORE ================== */
const statusEl = document.getElementById('status');

sendBtn.onclick = async () => {
  const meta = animalMeta[currentAnimal];

  render(true);
  const dataUrl = pc.toDataURL('image/png');
  render();

  sendBtn.disabled = true;
  statusEl.textContent = meta.habitat === "garden"
    ? "Sending to the garden..."
    : meta.habitat === "aquarium"
    ? "Sending to the aquarium..."
    : meta.habitat === "safari"
    ? "Sending to the safari..."
    : "Sending home...";

  try {
    await addDoc(creaturesCol, {
      img: dataUrl,
      animal: currentAnimal,
      habitat: meta.habitat,
      createdAt: serverTimestamp()
    });

    statusEl.textContent = `Off it goes! ${meta.emoji}`;

    fx.clearRect(0, 0, fill.width, fill.height);
    render();

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Hmm, couldn't send. Try again.";
  } finally {
    sendBtn.disabled = false;
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
  }
};

async function deleteByQuery(q, label){
  if (!confirm(`Are you sure you want to delete ${label}?`)) return;

  adminStatus.textContent = "Deleting...";
  const snap = await getDocs(q);

  const jobs = [];
  snap.forEach(d => {
    jobs.push(deleteDoc(doc(db, "creatures", d.id)));
  });

  await Promise.all(jobs);

  adminStatus.textContent = `Deleted ${jobs.length} drawing(s).`;
  loadRecentDrawings();
}

document.getElementById('deleteAll').onclick = async () => {
  await deleteByQuery(query(creaturesCol), "ALL drawings");
};

document.getElementById('deleteGarden').onclick = async () => {
  await deleteByQuery(
    query(creaturesCol, where("habitat", "==", "garden")),
    "all garden drawings"
  );
};

document.getElementById('deleteAquarium').onclick = async () => {
  await deleteByQuery(
    query(creaturesCol, where("habitat", "==", "aquarium")),

  );
};

document.getElementById('deleteSafari').onclick = async () => {
  await deleteByQuery(

  );
};

document.getElementById('deleteHouse').onclick = async () => {

  );

document.getElementById('loadRecent').onclick = loadRecentDrawings;

async function loadRecentDrawings(){
  adminStatus.textContent = "Loading recent drawings...";
  adminList.innerHTML = "";

  const q = query(
    creaturesCol,
    orderBy("createdAt", "desc"),
    limit(30)
  );

  const snap = await getDocs(q);

  snap.forEach(d => {
    const data = d.data();

    const card = document.createElement("div");
    card.className = "adminCard";

    const img = document.createElement("img");
    img.src = data.img;

    const label = document.createElement("small");
    label.textContent = `${data.animal || "unknown"} / ${data.habitat || "unknown"}`;

    const respawnBtn = document.createElement("button");
    respawnBtn.textContent = "Respawn";
    respawnBtn.onclick = async () => {
      await addDoc(creaturesCol, {
        img: data.img,
        animal: data.animal,
        habitat: data.habitat,
        createdAt: serverTimestamp(),
        respawned: true
      });

      adminStatus.textContent = "Drawing respawned.";
    };

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "danger";
    deleteBtn.textContent = "Delete";
    deleteBtn.onclick = async () => {
      if (!confirm("Delete this drawing?")) return;
      await deleteDoc(doc(db, "creatures", d.id));
      adminStatus.textContent = "Drawing deleted.";
      loadRecentDrawings();
    };

    card.appendChild(img);
    card.appendChild(label);
    card.appendChild(respawnBtn);
    card.appendChild(deleteBtn);

    adminList.appendChild(card);
  });

  adminStatus.textContent = `Loaded ${snap.size} drawing(s).`;
}
