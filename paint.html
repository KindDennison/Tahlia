<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paint an Animal</title>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    background: #f4f1e0;
  }

  #paintPanel {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vmin;
  }

  h1 {
    font-size: clamp(1.1em, 3.2vmin, 2.4em);
    color: #33691e;
    margin: 1vmin 0;
    text-align: center;
  }

  #topControls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1vmin;
    margin-bottom: 1vmin;
  }

  select, button, input {
    font-family: inherit;
  }

  select {
    font-size: clamp(.9em, 2vmin, 1.2em);
    padding: .7vmin 1.2vmin;
    border-radius: 12px;
    border: 2px solid #b7b7b7;
    background: #fff;
  }

  #paintWrap {
    position: relative;
    touch-action: none;
  }

  #paintCanvas {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    display: block;
  }

  #palette {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5vmin;
    margin: 2vmin 0 1vmin;
    max-width: 90vmin;
  }

  .swatch {
    width: 6vmin;
    height: 6vmin;
    min-width: 36px;
    min-height: 36px;
    max-width: 60px;
    max-height: 60px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
    cursor: pointer;
  }

  .swatch.active {
    border-color: #333;
    transform: scale(1.18);
  }

  #brushRow {
    display: flex;
    align-items: center;
    gap: 2vmin;
    margin: 1vmin 0 2vmin;
  }

  #brushRow label {
    font-size: clamp(.9em, 2.2vmin, 1.4em);
    color: #555;
  }

  #brushSize {
    width: 40vmin;
    max-width: 320px;
  }

  #brushPreview {
    width: 7vmin;
    height: 7vmin;
    max-width: 56px;
    max-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #brushPreview div {
    background: #333;
    border-radius: 50%;
  }

  #sendBtn {
    font-size: clamp(1.1em, 3vmin, 2em);
    font-weight: bold;
    color: #fff;
    background: #ff7043;
    border: none;
    padding: 2vmin 5vmin;
    border-radius: 40px;
    box-shadow: 0 4px 0 #d84315;
    cursor: pointer;
  }

  #sendBtn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #d84315;
  }

  #sendBtn:disabled {
    opacity: .5;
  }

  #status {
    height: 3vmin;
    font-size: clamp(.8em, 2vmin, 1.2em);
    color: #777;
    margin-top: 1vmin;
  }

  #adminToggle {
    position: fixed;
    right: 10px;
    bottom: 10px;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 18px;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    cursor: pointer;
    z-index: 20;
  }

  #adminPanel {
    display: none;
    position: fixed;
    inset: 3vmin;
    background: rgba(255,255,255,.96);
    z-index: 30;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    padding: 18px;
    overflow: auto;
    font-family: "Segoe UI", sans-serif;
  }

  #adminPanel h2 {
    margin-top: 0;
    color: #333;
  }

  .adminRow {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0;
    align-items: center;
  }

  .adminRow button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    background: #455a64;
    color: #fff;
    cursor: pointer;
  }

  .adminRow button.danger {
    background: #c62828;
  }

  .adminRow button.good {
    background: #2e7d32;
  }

  #adminList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    margin-top: 14px;
  }

  .adminCard {
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #fafafa;
    padding: 8px;
    text-align: center;
  }

  .adminCard img {
    width: 100%;
    height: 100px;
    object-fit: contain;
    background: #fff;
    border-radius: 8px;
  }

  .adminCard small {
    display: block;
    color: #555;
    margin: 4px 0 8px;
  }

  .adminCard button {
    width: 100%;
    margin-top: 4px;
    padding: 7px;
    border: none;
    border-radius: 8px;
    color: #fff;
    background: #1976d2;
    cursor: pointer;
  }

  .adminCard button.danger {
    background: #c62828;
  }
</style>
</head>

<body>

<div id="paintPanel">
  <h1 id="titleText">Paint your butterfly, then let it fly!</h1>

  <div id="topControls">
    <select id="animalSelect">
      <optgroup label="Garden">
        <option value="butterfly">Butterfly</option>
        <option value="ladybird">Ladybird</option>
        <option value="bee">Bee</option>
        <option value="frog">Frog</option>
      </optgroup>
      <optgroup label="Aquarium">
        <option value="fish">Fish</option>
        <option value="turtle">Turtle</option>
        <option value="jellyfish">Jellyfish</option>
        <option value="shark">Shark</option>
      </optgroup>
      <optgroup label="Safari">
        <option value="lion">Lion</option>
        <option value="zebra">Zebra</option>
        <option value="rhino">Rhino</option>
        <option value="elephant">Elephant</option>
      </optgroup>
      <optgroup label="House">
        <option value="cat">Cat</option>
        <option value="dog">Dog</option>
        <option value="hamster">Hamster</option>
        <option value="snake">Snake</option>
      </optgroup>
    </select>
  </div>

  <div id="paintWrap">
    <canvas id="paintCanvas" width="320" height="300"></canvas>
  </div>

  <div id="palette"></div>

  <div id="brushRow">
    <label for="brushSize">Brush</label>
    <input type="range" id="brushSize" min="6" max="40" value="16">
    <div id="brushPreview"><div></div></div>
  </div>

  <button id="sendBtn">Send away! 🦋</button>
  <div id="status"></div>
</div>

<button id="adminToggle">Admin</button>

<div id="adminPanel">
  <h2>Admin Area</h2>

  <div id="pinArea" class="adminRow">
    <input id="adminPin" type="password" placeholder="PIN">
    <button id="unlockAdmin">Unlock</button>
    <button id="closeAdmin">Close</button>
  </div>

  <div id="adminTools" style="display:none;">
    <div class="adminRow">
      <button id="loadRecent" class="good">Load recent drawings</button>
      <button id="deleteGarden" class="danger">Delete garden drawings</button>
      <button id="deleteAquarium" class="danger">Delete aquarium drawings</button>
      <button id="deleteSafari" class="danger">Delete safari drawings</button>
      <button id="deleteHouse" class="danger">Delete house drawings</button>
      <button id="deleteAll" class="danger">Delete ALL drawings</button>
      <button id="closeAdmin2">Close</button>
    </div>

    <div id="adminStatus"></div>
    <div id="adminList"></div>
  </div>
</div>

<script type="module">
/* ================== FIREBASE ================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  getDocs,
  deleteDoc,
  doc,
  query,
  where,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJXVZE2VZXPH9jJvzgz9ozBvvbiJfmLbw",
  authDomain: "teamdennisontracker.firebaseapp.com",
  projectId: "teamdennisontracker",
  storageBucket: "teamdennisontracker.firebasestorage.app",
  messagingSenderId: "915336870349",
  appId: "1:915336870349:web:c070e9b3fc0b688fe62c84"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const creaturesCol = collection(db, "creatures");

/* ================== SETTINGS ================== */
const ADMIN_PIN = "1234";

const animalMeta = {
  butterfly: { label: "butterfly", habitat: "garden", emoji: "🦋", action: "Fly away" },
  ladybird:  { label: "ladybird",  habitat: "garden", emoji: "🐞", action: "Crawl away" },
  bee:       { label: "bee",       habitat: "garden", emoji: "🐝", action: "Buzz away" },
  frog:      { label: "frog",      habitat: "garden", emoji: "🐸", action: "Hop away" },
  fish:      { label: "fish",      habitat: "aquarium", emoji: "🐟", action: "Swim away" },
  turtle:    { label: "turtle",    habitat: "aquarium", emoji: "🐢", action: "Swim away" },
  jellyfish: { label: "jellyfish", habitat: "aquarium", emoji: "🪼", action: "Float away" },
  shark:     { label: "shark",     habitat: "aquarium", emoji: "🦈", action: "Swim away" },
  lion:      { label: "lion",      habitat: "safari",   emoji: "🦁", action: "Roar away" },
  zebra:     { label: "zebra",     habitat: "safari",   emoji: "🦓", action: "Gallop away" },
  rhino:     { label: "rhino",     habitat: "safari",   emoji: "🦏", action: "Charge away" },
  elephant:  { label: "elephant",  habitat: "safari",   emoji: "🐘", action: "Trumpet away" },
  cat:       { label: "cat",       habitat: "house",    emoji: "🐱", action: "Pounce away" },
  dog:       { label: "dog",       habitat: "house",    emoji: "🐶", action: "Run away" },
  hamster:   { label: "hamster",   habitat: "house",    emoji: "🐹", action: "Scurry away" },
  snake:     { label: "snake",     habitat: "house",    emoji: "🐍", action: "Slither away" }
};

let currentAnimal = "butterfly";

/* ================== CANVAS ================== */
const pc = document.getElementById('paintCanvas');
const px = pc.getContext('2d');

const fill = document.createElement('canvas');
fill.width = pc.width;
fill.height = pc.height;
const fx = fill.getContext('2d');

function fitCanvas(){
  const panel = document.getElementById('paintPanel');
  const others = panel.clientHeight
    - document.querySelector('h1').offsetHeight
    - document.getElementById('topControls').offsetHeight
    - document.getElementById('palette').offsetHeight
    - document.getElementById('brushRow').offsetHeight
    - document.getElementById('sendBtn').offsetHeight
    - document.getElementById('status').offsetHeight
    - 70;

  const maxH = Math.max(150, others);
  const maxW = panel.clientWidth - 24;
  const ratio = 320 / 300;

  let w = maxW;
  let h = w / ratio;

  if (h > maxH) {
    h = maxH;
    w = h * ratio;
  }

  pc.style.width = w + 'px';
  pc.style.height = h + 'px';
}

window.addEventListener('resize', fitCanvas);

/* ================== PALETTE ================== */
const colours = [
  "#e53935",
  "#fb8c00",
  "#fdd835",
  "#43a047",
  "#1e88e5",
  "#8e24aa",
  "#ec407a",
  "#00acc1",
  "#6d4c41",
  "#000000",
  "#ffffff"
];

let currentColour = colours[5];

const palette = document.getElementById('palette');

colours.forEach((c) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (c === currentColour ? ' active' : '');
  s.style.background = c;

  s.onclick = () => {
    currentColour = c;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    updateBrushPreview();
  };

  palette.appendChild(s);
});

/* ================== BRUSH ================== */
const brushSizeEl = document.getElementById('brushSize');
const brushPrev = document.querySelector('#brushPreview div');
let brushSize = Number(brushSizeEl.value);

function updateBrushPreview(){
  brushPrev.style.width = brushSize + 'px';
  brushPrev.style.height = brushSize + 'px';
  brushPrev.style.background = currentColour === '#ffffff' ? '#ccc' : currentColour;
}

brushSizeEl.addEventListener('input', () => {
  brushSize = Number(brushSizeEl.value);
  updateBrushPreview();
});

/* ================== CREATURE PATHS ================== */
function creaturePath(ctx){
  const cx = 160;
  const cy = 150;

  ctx.beginPath();

  /* ---------- GARDEN ---------- */
  if (currentAnimal === "butterfly") {
    ctx.moveTo(cx, cy);
    ctx.bezierCurveTo(cx - 90, cy - 110, cx - 150, cy - 60, cx - 60, cy - 10);
    ctx.bezierCurveTo(cx - 30, cy - 5, cx - 15, cy - 10, cx, cy);

    ctx.moveTo(cx, cy);
    ctx.bezierCurveTo(cx - 50, cy + 20, cx - 110, cy + 40, cx - 70, cy + 95);
    ctx.bezierCurveTo(cx - 40, cy + 115, cx - 15, cy + 60, cx, cy + 10);

    ctx.moveTo(cx, cy);
    ctx.bezierCurveTo(cx + 90, cy - 110, cx + 150, cy - 60, cx + 60, cy - 10);
    ctx.bezierCurveTo(cx + 30, cy - 5, cx + 15, cy - 10, cx, cy);

    ctx.moveTo(cx, cy);
    ctx.bezierCurveTo(cx + 50, cy + 20, cx + 110, cy + 40, cx + 70, cy + 95);
    ctx.bezierCurveTo(cx + 40, cy + 115, cx + 15, cy + 60, cx, cy + 10);
  }

  else if (currentAnimal === "ladybird") {
    ctx.ellipse(cx, cy + 10, 95, 85, 0, 0, Math.PI * 2);
    ctx.moveTo(cx + 95, cy + 10);
    ctx.arc(cx, cy - 68, 32, 0, Math.PI * 2);
  }

  else if (currentAnimal === "bee") {
    ctx.ellipse(cx, cy + 10, 100, 65, 0, 0, Math.PI * 2);
    ctx.moveTo(cx - 95, cy + 10);
    ctx.arc(cx - 118, cy + 5, 26, 0, Math.PI * 2);
    ctx.moveTo(cx + 10, cy - 55);
    ctx.ellipse(cx + 25, cy - 75, 50, 28, -0.3, 0, Math.PI * 2);
    ctx.moveTo(cx - 10, cy - 50);
    ctx.ellipse(cx - 15, cy - 70, 40, 22, -0.4, 0, Math.PI * 2);
  }

  else if (currentAnimal === "frog") {
    ctx.ellipse(cx, cy + 20, 95, 75, 0, 0, Math.PI * 2);
    ctx.moveTo(cx - 45, cy - 48);
    ctx.arc(cx - 45, cy - 48, 26, 0, Math.PI * 2);
    ctx.moveTo(cx + 45, cy - 48);
    ctx.arc(cx + 45, cy - 48, 26, 0, Math.PI * 2);
    ctx.moveTo(cx - 85, cy + 80);
    ctx.ellipse(cx - 108, cy + 88, 35, 16, -0.2, 0, Math.PI * 2);
    ctx.moveTo(cx + 85, cy + 80);
    ctx.ellipse(cx + 108, cy + 88, 35, 16, 0.2, 0, Math.PI * 2);
  }

  /* ---------- AQUARIUM ---------- */
  else if (currentAnimal === "fish") {
    ctx.moveTo(255, cy);
    ctx.bezierCurveTo(255, cy - 75, 120, cy - 80, 70, cy);
    ctx.bezierCurveTo(120, cy + 80, 255, cy + 75, 255, cy);

    ctx.moveTo(70, cy);
    ctx.lineTo(20, cy - 55);
    ctx.lineTo(10, cy - 35);
    ctx.moveTo(70, cy);
    ctx.lineTo(20, cy + 55);
    ctx.lineTo(10, cy + 35);

    ctx.moveTo(145, cy - 62);
    ctx.bezierCurveTo(155, cy - 100, 195, cy - 95, 210, cy - 60);

    ctx.moveTo(175, cy + 30);
    ctx.bezierCurveTo(185, cy + 75, 210, cy + 75, 215, cy + 35);
  }

  else if (currentAnimal === "turtle") {
    ctx.ellipse(cx - 10, cy + 5, 90, 70, 0, 0, Math.PI * 2);

    ctx.moveTo(cx + 80, cy - 20);
    ctx.bezierCurveTo(cx + 95, cy - 40, cx + 130, cy - 35, cx + 138, cy - 15);
    ctx.bezierCurveTo(cx + 145, cy, cx + 130, cy + 15, cx + 110, cy + 12);
    ctx.bezierCurveTo(cx + 90, cy + 10, cx + 80, cy, cx + 80, cy - 20);

    ctx.moveTo(cx - 50, cy - 60);
    ctx.bezierCurveTo(cx - 65, cy - 90, cx - 120, cy - 85, cx - 115, cy - 55);
    ctx.bezierCurveTo(cx - 110, cy - 30, cx - 70, cy - 35, cx - 50, cy - 60);

    ctx.moveTo(cx - 55, cy + 60);
    ctx.bezierCurveTo(cx - 70, cy + 90, cx - 125, cy + 85, cx - 118, cy + 55);
    ctx.bezierCurveTo(cx - 110, cy + 30, cx - 70, cy + 35, cx - 55, cy + 60);

    ctx.moveTo(cx + 50, cy - 55);
    ctx.bezierCurveTo(cx + 60, cy - 80, cx + 100, cy - 78, cx + 98, cy - 52);
    ctx.bezierCurveTo(cx + 95, cy - 30, cx + 60, cy - 32, cx + 50, cy - 55);

    ctx.moveTo(cx + 45, cy + 60);
    ctx.bezierCurveTo(cx + 55, cy + 88, cx + 95, cy + 85, cx + 92, cy + 58);
    ctx.bezierCurveTo(cx + 88, cy + 35, cx + 55, cy + 38, cx + 45, cy + 60);
  }

  else if (currentAnimal === "jellyfish") {
    ctx.moveTo(cx - 85, cy - 5);
    ctx.bezierCurveTo(cx - 75, cy - 110, cx + 75, cy - 110, cx + 85, cy - 5);
    ctx.quadraticCurveTo(cx + 60, cy + 30, cx + 30, cy);
    ctx.quadraticCurveTo(cx, cy + 30, cx - 30, cy);
    ctx.quadraticCurveTo(cx - 60, cy + 30, cx - 85, cy - 5);
  }

  else if (currentAnimal === "shark") {
    ctx.moveTo(290, cy + 10);
    ctx.bezierCurveTo(270, cy - 55, 160, cy - 70, 50, cy - 10);
    ctx.bezierCurveTo(30, cy, 30, cy + 20, 50, cy + 25);
    ctx.bezierCurveTo(160, cy + 65, 270, cy + 55, 290, cy + 10);

    ctx.moveTo(50, cy - 10);
    ctx.lineTo(10, cy - 60);
    ctx.lineTo(20, cy - 20);
    ctx.moveTo(50, cy + 25);
    ctx.lineTo(10, cy + 70);
    ctx.lineTo(20, cy + 30);

    ctx.moveTo(150, cy - 58);
    ctx.lineTo(175, cy - 118);
    ctx.lineTo(210, cy - 52);

    ctx.moveTo(170, cy + 30);
    ctx.lineTo(165, cy + 90);
    ctx.lineTo(215, cy + 35);

    ctx.moveTo(230, cy - 40);
    ctx.bezierCurveTo(220, cy - 10, 220, cy + 10, 230, cy + 35);
  }

  /* ---------- SAFARI ---------- */
  else if (currentAnimal === "lion") {
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      const mx = cx + Math.cos(a) * 88;
      const my = cy + Math.sin(a) * 85;
      ctx.moveTo(mx, my);
      ctx.arc(mx, my, 22, 0, Math.PI * 2);
    }

    ctx.moveTo(cx + 60, cy);
    ctx.ellipse(cx, cy, 60, 68, 0, 0, Math.PI * 2);

    ctx.moveTo(cx - 42, cy - 58);
    ctx.arc(cx - 48, cy - 64, 14, 0, Math.PI * 2);
    ctx.moveTo(cx + 42, cy - 58);
    ctx.arc(cx + 48, cy - 64, 14, 0, Math.PI * 2);
  }

  else if (currentAnimal === "zebra") {
    ctx.moveTo(cx + 85, cy + 30);
    ctx.bezierCurveTo(cx + 90, cy - 30, cx + 50, cy - 60, cx + 10, cy - 55);
    ctx.bezierCurveTo(cx - 30, cy - 50, cx - 90, cy - 20, cx - 95, cy + 30);
    ctx.bezierCurveTo(cx - 95, cy + 70, cx + 85, cy + 70, cx + 85, cy + 30);

    ctx.moveTo(cx + 10, cy - 55);
    ctx.bezierCurveTo(cx + 15, cy - 90, cx + 30, cy - 110, cx + 40, cy - 115);
    ctx.bezierCurveTo(cx + 65, cy - 120, cx + 75, cy - 100, cx + 70, cy - 70);
    ctx.bezierCurveTo(cx + 65, cy - 50, cx + 50, cy - 45, cx + 10, cy - 55);

    ctx.moveTo(cx + 38, cy - 118);
    ctx.lineTo(cx + 32, cy - 145);
    ctx.lineTo(cx + 52, cy - 125);
    ctx.moveTo(cx + 58, cy - 115);
    ctx.lineTo(cx + 58, cy - 140);
    ctx.lineTo(cx + 72, cy - 120);

    ctx.moveTo(cx - 55, cy + 68);  ctx.lineTo(cx - 55, cy + 135);
    ctx.moveTo(cx - 25, cy + 70);  ctx.lineTo(cx - 25, cy + 138);
    ctx.moveTo(cx + 30, cy + 68);  ctx.lineTo(cx + 30, cy + 135);
    ctx.moveTo(cx + 60, cy + 65);  ctx.lineTo(cx + 60, cy + 132);

    ctx.moveTo(cx - 95, cy + 20);
    ctx.bezierCurveTo(cx - 120, cy + 10, cx - 130, cy + 40, cx - 115, cy + 70);
  }

  else if (currentAnimal === "rhino") {
    ctx.moveTo(cx + 95, cy + 35);
    ctx.bezierCurveTo(cx + 100, cy - 20, cx + 60, cy - 55, cx + 20, cy - 50);
    ctx.bezierCurveTo(cx - 20, cy - 45, cx - 90, cy - 25, cx - 100, cy + 35);
    ctx.bezierCurveTo(cx - 100, cy + 75, cx + 95, cy + 75, cx + 95, cy + 35);

    ctx.moveTo(cx + 20, cy - 50);
    ctx.bezierCurveTo(cx + 25, cy - 80, cx + 50, cy - 90, cx + 80, cy - 75);
    ctx.bezierCurveTo(cx + 120, cy - 55, cx + 130, cy - 20, cx + 120, cy + 10);
    ctx.bezierCurveTo(cx + 105, cy + 30, cx + 85, cy + 30, cx + 70, cy + 20);
    ctx.bezierCurveTo(cx + 55, cy + 10, cx + 50, cy - 20, cx + 20, cy - 50);

    ctx.moveTo(cx + 105, cy - 55);
    ctx.lineTo(cx + 118, cy - 100);
    ctx.lineTo(cx + 92, cy - 55);
    ctx.moveTo(cx + 82, cy - 60);
    ctx.lineTo(cx + 90, cy - 85);
    ctx.lineTo(cx + 70, cy - 60);

    ctx.moveTo(cx + 50, cy - 82);
    ctx.arc(cx + 50, cy - 92, 12, 0, Math.PI * 2);

    ctx.moveTo(cx - 55, cy + 73);  ctx.lineTo(cx - 55, cy + 130);
    ctx.moveTo(cx - 20, cy + 75);  ctx.lineTo(cx - 20, cy + 133);
    ctx.moveTo(cx + 25, cy + 72);  ctx.lineTo(cx + 25, cy + 130);
    ctx.moveTo(cx + 58, cy + 68);  ctx.lineTo(cx + 58, cy + 125);

    ctx.moveTo(cx - 100, cy + 20);
    ctx.bezierCurveTo(cx - 118, cy + 15, cx - 122, cy + 35, cx - 110, cy + 50);
  }

  else if (currentAnimal === "elephant") {
    ctx.ellipse(cx - 15, cy + 15, 92, 72, 0, 0, Math.PI * 2);
    ctx.moveTo(cx + 55, cy - 30);

function drawCreatureDetails(ctx){

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, Math.PI * 2);

    ctx.moveTo(cx + 3, cy - 40);

function render(forExport = false){
  px.clearRect(0, 0, pc.width, pc.height);

  if (!forExport) {
    px.fillStyle = "#fff";
    px.fillRect(0, 0, pc.width, pc.height);
  }

  px.drawImage(fill, 0, 0);

  px.lineWidth = 4;
  px.strokeStyle = "#333";
  creaturePath(px);
  px.stroke();

  drawCreatureDetails(px);
}

/* ================== PAINTING ================== */
let painting = false;

function paintAt(x, y){
  fx.save();
  creaturePath(fx);
  fx.clip();

  fx.fillStyle = currentColour;
  fx.beginPath();
  fx.arc(x, y, brushSize, 0, Math.PI * 2);
  fx.fill();

  fx.restore();
  render();
}

function pos(e){
  const r = pc.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;

  return {
    x: (t.clientX - r.left) * (pc.width / r.width),
    y: (t.clientY - r.top) * (pc.height / r.height)
  };
}

function down(e){
  painting = true;
  const p = pos(e);
  paintAt(p.x, p.y);
  e.preventDefault();
}

function move(e){
  if (painting) {
    const p = pos(e);
    paintAt(p.x, p.y);
    e.preventDefault();
  }
}

function up(){
  painting = false;
}

pc.addEventListener('mousedown', down);
pc.addEventListener('mousemove', move);
window.addEventListener('mouseup', up);

pc.addEventListener('touchstart', down, { passive:false });
pc.addEventListener('touchmove', move, { passive:false });
pc.addEventListener('touchend', up);

/* ================== SEND TO FIRESTORE ================== */
const statusEl = document.getElementById('status');

sendBtn.onclick = async () => {
  const meta = animalMeta[currentAnimal];

  render(true);
  const dataUrl = pc.toDataURL('image/png');
  render();

  sendBtn.disabled = true;
  statusEl.textContent = meta.habitat === "garden"
    ? "Sending to the garden..."
    : meta.habitat === "aquarium"
    ? "Sending to the aquarium..."
    : meta.habitat === "safari"
    ? "Sending to the safari..."
    : "Sending home...";

  try {
    await addDoc(creaturesCol, {
      img: dataUrl,
      animal: currentAnimal,
      habitat: meta.habitat,
      createdAt: serverTimestamp()
    });

    statusEl.textContent = `Off it goes! ${meta.emoji}`;

    fx.clearRect(0, 0, fill.width, fill.height);
    render();

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Hmm, couldn't send. Try again.";
  } finally {
    sendBtn.disabled = false;
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
  }
};

async function deleteByQuery(q, label){
  if (!confirm(`Are you sure you want to delete ${label}?`)) return;

  adminStatus.textContent = "Deleting...";
  const snap = await getDocs(q);

  const jobs = [];
  snap.forEach(d => {
    jobs.push(deleteDoc(doc(db, "creatures", d.id)));
  });

  await Promise.all(jobs);

  adminStatus.textContent = `Deleted ${jobs.length} drawing(s).`;
  loadRecentDrawings();
}

  );
};

document.getElementById('deleteSafari').onclick = async () => {
  await deleteByQuery(
    query(creaturesCol, where("habitat", "==", "safari")),
    "all safari drawings"
  );
};

document.getElementById('deleteHouse').onclick = async () => {
  await deleteByQuery(
    query(creaturesCol, where("habitat", "==", "house")),
    "all house drawings"
  );
};

document.getElementById('loadRecent').onclick = loadRecentDrawings;

async function loadRecentDrawings(){
  adminStatus.textContent = "Loading recent drawings...";
  adminList.innerHTML = "";

  const q = query(
    creaturesCol,
    orderBy("createdAt", "desc"),
    limit(30)
  );

  const snap = await getDocs(q);

  snap.forEach(d => {
    const data = d.data();

    const card = document.createElement("div");
    card.className = "adminCard";

    const img = document.createElement("img");
    img.src = data.img;

    const label = document.createElement("small");
    label.textContent = `${data.animal || "unknown"} / ${data.habitat || "unknown"}`;

    const respawnBtn = document.createElement("button");
    respawnBtn.textContent = "Respawn";
    respawnBtn.onclick = async () => {
      await addDoc(creaturesCol, {
        img: data.img,
        animal: data.animal,
        habitat: data.habitat,
        createdAt: serverTimestamp(),
        respawned: true
      });

      adminStatus.textContent = "Drawing respawned.";
    };

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "danger";
    deleteBtn.textContent = "Delete";
    deleteBtn.onclick = async () => {
      if (!confirm("Delete this drawing?")) return;
      await deleteDoc(doc(db, "creatures", d.id));
      adminStatus.textContent = "Drawing deleted.";
      loadRecentDrawings();
    };

    card.appendChild(img);
    card.appendChild(label);
    card.appendChild(respawnBtn);
    card.appendChild(deleteBtn);

    adminList.appendChild(card);
  });

  adminStatus.textContent = `Loaded ${snap.size} drawing(s).`;
}

/* ================== INIT ================== */
fitCanvas();
updateBrushPreview();
updateAnimalText();
render();
</script>
