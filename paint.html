<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paint a Butterfly</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Comic Sans MS", "Segoe UI", sans-serif; background: #f4f1e0; }
  #paintPanel { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2vmin; }
  h1 { font-size: clamp(1.2em, 3.5vmin, 2.6em); color: #33691e; margin: 1vmin 0; text-align: center; }
  #paintWrap { position: relative; touch-action: none; }
  #paintCanvas { background: #fff; border-radius: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.2); display: block; }
  #palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5vmin; margin: 2vmin 0 1vmin; max-width: 90vmin; }
  .swatch { width: 6vmin; height: 6vmin; min-width: 36px; min-height: 36px; max-width: 60px; max-height: 60px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.3); cursor: pointer; }
  .swatch.active { border-color: #333; transform: scale(1.18); }
  #brushRow { display: flex; align-items: center; gap: 2vmin; margin: 1vmin 0 2vmin; }
  #brushRow label { font-size: clamp(.9em, 2.2vmin, 1.4em); color: #555; }
  #brushSize { width: 40vmin; max-width: 320px; }
  #brushPreview { width: 7vmin; height: 7vmin; max-width: 56px; max-height: 56px; display: flex; align-items: center; justify-content: center; }
  #brushPreview div { background: #333; border-radius: 50%; }
  #flyBtn { font-size: clamp(1.1em, 3vmin, 2em); font-weight: bold; color: #fff; background: #ff7043; border: none;
            padding: 2vmin 5vmin; border-radius: 40px; box-shadow: 0 4px 0 #d84315; cursor: pointer; }
  #flyBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d84315; }
  #flyBtn:disabled { opacity: .5; }
  #status { height: 3vmin; font-size: clamp(.8em, 2vmin, 1.2em); color: #777; margin-top: 1vmin; }
</style>
</head>
<body>
<div id="paintPanel">
  <h1>Paint your butterfly, then let it fly!</h1>
  <div id="paintWrap"><canvas id="paintCanvas" width="320" height="300"></canvas></div>
  <div id="palette"></div>
  <div id="brushRow">
    <label for="brushSize">Brush</label>
    <input type="range" id="brushSize" min="6" max="40" value="16">
    <div id="brushPreview"><div></div></div>
  </div>
  <button id="flyBtn">Fly away! 🦋</button>
  <div id="status"></div>
</div>

<script type="module">
/* ================== FIREBASE ================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== PASTE FIREBASE CONFIG HERE ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDJXVZE2VZXPH9jJvzgz9ozBvvbiJfmLbw",
  authDomain: "teamdennisontracker.firebaseapp.com",
  projectId: "teamdennisontracker",
  storageBucket: "teamdennisontracker.firebasestorage.app",
  messagingSenderId: "915336870349",
  appId: "1:915336870349:web:c070e9b3fc0b688fe62c84"
};
/* ====================================== */

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const butterflies = collection(db, "butterflies");   // collection name

/* ================== RESPONSIVE CANVAS SCALING ================== */
const pc = document.getElementById('paintCanvas');
const px = pc.getContext('2d');

/* The internal drawing resolution stays 320x300 so all the maths below
   (centre at 160,150 etc.) is unchanged. We only scale the CSS size. */
function fitCanvas(){
  const panel = document.getElementById('paintPanel');
  const others = panel.clientHeight
    - document.querySelector('h1').offsetHeight
    - document.getElementById('palette').offsetHeight
    - document.getElementById('brushRow').offsetHeight
    - document.getElementById('flyBtn').offsetHeight
    - document.getElementById('status').offsetHeight
    - 60; // padding/margins headroom
  const maxH = Math.max(150, others);
  const maxW = panel.clientWidth - 24;
  // keep 320:300 aspect ratio, fit within available space
  const ratio = 320/300;
  let w = maxW, h = w/ratio;
  if (h > maxH){ h = maxH; w = h*ratio; }
  pc.style.width  = w + 'px';
  pc.style.height = h + 'px';
}
window.addEventListener('resize', fitCanvas);

/* ================== PALETTE ================== */
const colours = ["#e53935","#fb8c00","#fdd835","#43a047","#1e88e5",
                 "#8e24aa","#ec407a","#00acc1","#6d4c41","#000000","#ffffff"];
let currentColour = colours[5];
const palette = document.getElementById('palette');
colours.forEach((c)=>{
  const s = document.createElement('div');
  s.className = 'swatch' + (c===currentColour ? ' active':'');
  s.style.background = c;
  s.onclick = ()=>{
    currentColour = c;
    document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));
    s.classList.add('active');
    updateBrushPreview();
  };
  palette.appendChild(s);
});

/* ================== BRUSH SIZE ================== */
const brushSizeEl = document.getElementById('brushSize');
const brushPrev = document.querySelector('#brushPreview div');
let brushSize = Number(brushSizeEl.value);
function updateBrushPreview(){
  brushPrev.style.width  = brushSize + 'px';
  brushPrev.style.height = brushSize + 'px';
  brushPrev.style.background = (currentColour === '#ffffff') ? '#ccc' : currentColour;
}
brushSizeEl.addEventListener('input', ()=>{
  brushSize = Number(brushSizeEl.value);
  updateBrushPreview();
});

/* ================== BUTTERFLY DRAWING ================== */
function butterflyPath(ctx){
  const cx=160, cy=150;
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.bezierCurveTo(cx-90,cy-110, cx-150,cy-60, cx-60,cy-10);
  ctx.bezierCurveTo(cx-30,cy-5, cx-15,cy-10, cx,cy);
  ctx.moveTo(cx,cy);
  ctx.bezierCurveTo(cx-50,cy+20, cx-110,cy+40, cx-70,cy+95);
  ctx.bezierCurveTo(cx-40,cy+115, cx-15,cy+60, cx,cy+10);
  ctx.moveTo(cx,cy);
  ctx.bezierCurveTo(cx+90,cy-110, cx+150,cy-60, cx+60,cy-10);
  ctx.bezierCurveTo(cx+30,cy-5, cx+15,cy-10, cx,cy);
  ctx.moveTo(cx,cy);
  ctx.bezierCurveTo(cx+50,cy+20, cx+110,cy+40, cx+70,cy+95);
  ctx.bezierCurveTo(cx+40,cy+115, cx+15,cy+60, cx,cy+10);
}

const fill = document.createElement('canvas');
fill.width = pc.width; fill.height = pc.height;
const fx = fill.getContext('2d');

function drawBody(ctx){
  const cx=160, cy=150;
  ctx.fillStyle = "#333";
  ctx.beginPath(); ctx.ellipse(cx,cy+25,9,55,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy-30,12,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle="#333";
  ctx.beginPath(); ctx.moveTo(cx-3,cy-38); ctx.quadraticCurveTo(cx-22,cy-70,cx-30,cy-72); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+3,cy-38); ctx.quadraticCurveTo(cx+22,cy-70,cx+30,cy-72); ctx.stroke();
}

/* render() now takes a flag. For the on-screen canvas we paint a white
   background so the child can see what they're doing. For the EXPORT we
   skip the white fill so the saved PNG is transparent outside the wings. */
function render(forExport=false){
  px.clearRect(0,0,pc.width,pc.height);
  if(!forExport){
    px.fillStyle="#fff"; px.fillRect(0,0,pc.width,pc.height);
  }
  px.drawImage(fill,0,0);
  px.lineWidth=4; px.strokeStyle="#333";
  butterflyPath(px); px.stroke();
  drawBody(px);
}

/* ================== PAINTING ================== */
let painting=false;
function paintAt(x,y){
  fx.save(); butterflyPath(fx); fx.clip();
  fx.fillStyle=currentColour;
  fx.beginPath(); fx.arc(x,y,brushSize,0,Math.PI*2); fx.fill();
  fx.restore(); render();
}
function pos(e){
  const r=pc.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x:(t.clientX-r.left)*(pc.width/r.width), y:(t.clientY-r.top)*(pc.height/r.height) };
}
function down(e){ painting=true; const p=pos(e); paintAt(p.x,p.y); e.preventDefault(); }
function move(e){ if(painting){ const p=pos(e); paintAt(p.x,p.y); e.preventDefault(); } }
function up(){ painting=false; }
pc.addEventListener('mousedown',down); pc.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
pc.addEventListener('touchstart',down,{passive:false});
pc.addEventListener('touchmove',move,{passive:false});
pc.addEventListener('touchend',up);

/* ================== FLY AWAY (write to Firestore) ================== */
const flyBtn = document.getElementById('flyBtn');
const statusEl = document.getElementById('status');

flyBtn.onclick = async ()=>{
  render(true);                                      // transparent export render
  const dataUrl = pc.toDataURL('image/png');         // PNG keeps transparency
  render();                                          // restore white-bg view
  flyBtn.disabled = true; statusEl.textContent = "Sending to the garden...";
  try {
    await addDoc(butterflies, { img: dataUrl, createdAt: serverTimestamp() });
    statusEl.textContent = "Off it flies! 🦋";
    fx.clearRect(0,0,fill.width,fill.height);          // reset for next child
    render();
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Hmm, couldn't send. Try again.";
  } finally {
    flyBtn.disabled = false;
    setTimeout(()=>{ statusEl.textContent=""; }, 2500);
  }
};

/* ================== INIT ================== */
fitCanvas();
updateBrushPreview();
render();
</script>
</body>
</html>
