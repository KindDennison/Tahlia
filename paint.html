<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paint an Animal</title>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    background: #f4f1e0;
  }

  #paintPanel {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vmin;
  }

  h1 {
    font-size: clamp(1.1em, 3.2vmin, 2.4em);
    color: #33691e;
    margin: 1vmin 0;
    text-align: center;
  }

  #topControls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1vmin;
    margin-bottom: 1vmin;
  }

  select, button, input {
    font-family: inherit;
  }

  select {
    font-size: clamp(.9em, 2vmin, 1.2em);
    padding: .7vmin 1.2vmin;
    border-radius: 12px;
    border: 2px solid #b7b7b7;
    background: #fff;
  }

  #paintWrap {
    position: relative;
    touch-action: none;
  }

  #paintCanvas {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    display: block;
  }

  #palette {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5vmin;
    margin: 2vmin 0 1vmin;
    max-width: 90vmin;
  }

  .swatch {
    width: 6vmin;
    height: 6vmin;
    min-width: 36px;
    min-height: 36px;
    max-width: 60px;
    max-height: 60px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
    cursor: pointer;
  }

  .swatch.active {
    border-color: #333;
    transform: scale(1.18);
  }

  #brushRow {
    display: flex;
    align-items: center;
    gap: 2vmin;
    margin: 1vmin 0 2vmin;
  }

  #brushRow label {
    font-size: clamp(.9em, 2.2vmin, 1.4em);
    color: #555;
  }

  #brushSize {
    width: 40vmin;
    max-width: 320px;
  }

  #brushPreview {
    width: 7vmin;
    height: 7vmin;
    max-width: 56px;
    max-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #brushPreview div {
    background: #333;
    border-radius: 50%;
  }

  #sendBtn {
    font-size: clamp(1.1em, 3vmin, 2em);
    font-weight: bold;
    color: #fff;
    background: #ff7043;
    border: none;
    padding: 2vmin 5vmin;
    border-radius: 40px;
    box-shadow: 0 4px 0 #d84315;
    cursor: pointer;
  }

  #sendBtn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #d84315;
  }

  #sendBtn:disabled {
    opacity: .5;
  }

  #status {
    height: 3vmin;
    font-size: clamp(.8em, 2vmin, 1.2em);
    color: #777;
    margin-top: 1vmin;
  }

  #adminToggle {
    position: fixed;
    right: 10px;
    bottom: 10px;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 18px;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    cursor: pointer;
    z-index: 20;
  }

  #adminPanel {
    display: none;
    position: fixed;
    inset: 3vmin;
    background: rgba(255,255,255,.96);
    z-index: 30;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    padding: 18px;
    overflow: auto;
    font-family: "Segoe UI", sans-serif;
  }

  #adminPanel h2 {
    margin-top: 0;
    color: #333;
  }

  .adminRow {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0;
    align-items: center;
  }

  .adminRow button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    background: #455a64;
    color: #fff;
    cursor: pointer;
  }

  .adminRow button.danger {
    background: #c62828;
  }

  .adminRow button.good {
    background: #2e7d32;
  }

  #adminList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    margin-top: 14px;
  }

  .adminCard {
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #fafafa;
    padding: 8px;
    text-align: center;
  }

  .adminCard img {
    width: 100%;
    height: 100px;
    object-fit: contain;
    background: #fff;
    border-radius: 8px;
  }

  .adminCard small {
    display: block;
    color: #555;
    margin: 4px 0 8px;
  }

  .adminCard button {
    width: 100%;
    margin-top: 4px;
    padding: 7px;
    border: none;
    border-radius: 8px;
    color: #fff;
    background: #1976d2;
    cursor: pointer;
  }

  .adminCard button.danger {
    background: #c62828;
  }
</style>
</head>

<body>

<div id="paintPanel">
  <h1 id="titleText">Paint your butterfly, then let it fly!</h1>

  <div id="topControls">
    <select id="animalSelect">
      <optgroup label="Garden">
        <option value="butterfly">Butterfly</option>
        <option value="ladybird">Ladybird</option>
        <option value="bee">Bee</option>
        <option value="frog">Frog</option>
      </optgroup>
      <optgroup label="Aquarium">
        <option value="fish">Fish</option>
        <option value="turtle">Turtle</option>
        <option value="jellyfish">Jellyfish</option>
        <option value="shark">Shark</option>
      </optgroup>
      <optgroup label="Safari">
        <option value="lion">Lion</option>
        <option value="zebra">Zebra</option>
        <option value="rhino">Rhino</option>
        <option value="elephant">Elephant</option>
      </optgroup>
      <optgroup label="House">
        <option value="cat">Cat</option>
        <option value="dog">Dog</option>
        <option value="hamster">Hamster</option>
        <option value="snake">Snake</option>
      </optgroup>
    </select>
  </div>

  <div id="paintWrap">
    <canvas id="paintCanvas" width="320" height="300"></canvas>
  </div>

  <div id="palette"></div>

  <div id="brushRow">
    <label for="brushSize">Brush</label>
    <input type="range" id="brushSize" min="6" max="40" value="16">
    <div id="brushPreview"><div></div></div>
  </div>

  <button id="sendBtn">Send away! 🦋</button>
  <div id="status"></div>
</div>

<button id="adminToggle">Admin</button>

<div id="adminPanel">
  <h2>Admin Area</h2>

  <div id="pinArea" class="adminRow">
    <input id="adminPin" type="password" placeholder="PIN">
    <button id="unlockAdmin">Unlock</button>
    <button id="closeAdmin">Close</button>
  </div>

  <div id="adminTools" style="display:none;">
    <div class="adminRow">
      <button id="loadRecent" class="good">Load recent drawings</button>
      <button id="deleteGarden" class="danger">Delete garden drawings</button>
      <button id="deleteAquarium" class="danger">Delete aquarium drawings</button>
      <button id="deleteSafari" class="danger">Delete safari drawings</button>
      <button id="deleteHouse" class="danger">Delete house drawings</button>
      <button id="deleteAll" class="danger">Delete ALL drawings</button>
      <button id="closeAdmin2">Close</button>
    </div>

    <div id="adminStatus"></div>
    <div id="adminList"></div>
  </div>
</div>

<script type="module">
/* ================== FIREBASE ================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  getDocs,
  deleteDoc,
  doc,
  query,
  where,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJXVZE2VZXPH9jJvzgz9ozBvvbiJfmLbw",
  authDomain: "teamdennisontracker.firebaseapp.com",
  projectId: "teamdennisontracker",
  storageBucket: "teamdennisontracker.firebasestorage.app",
  messagingSenderId: "915336870349",
  appId: "1:915336870349:web:c070e9b3fc0b688fe62c84"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const creaturesCol = collection(db, "creatures");

/* ================== SETTINGS ================== */
const ADMIN_PIN = "1234";

const animalMeta = {
  butterfly: { label: "butterfly", habitat: "garden", emoji: "🦋", action: "Fly away" },
  ladybird:  { label: "ladybird",  habitat: "garden", emoji: "🐞", action: "Crawl away" },
  bee:       { label: "bee",       habitat: "garden", emoji: "🐝", action: "Buzz away" },
  frog:      { label: "frog",      habitat: "garden", emoji: "🐸", action: "Hop away" },
  fish:      { label: "fish",      habitat: "aquarium", emoji: "🐟", action: "Swim away" },
  turtle:    { label: "turtle",    habitat: "aquarium", emoji: "🐢", action: "Swim away" },
  jellyfish: { label: "jellyfish", habitat: "aquarium", emoji: "🪼", action: "Float away" },
  shark:     { label: "shark",     habitat: "aquarium", emoji: "🦈", action: "Swim away" },
  lion:      { label: "lion",      habitat: "safari",   emoji: "🦁", action: "Roar away" },
  zebra:     { label: "zebra",     habitat: "safari",   emoji: "🦓", action: "Gallop away" },
  rhino:     { label: "rhino",     habitat: "safari",   emoji: "🦏", action: "Charge away" },
  elephant:  { label: "elephant",  habitat: "safari",   emoji: "🐘", action: "Trumpet away" },
  cat:       { label: "cat",       habitat: "house",    emoji: "🐱", action: "Pounce away" },
  dog:       { label: "dog",       habitat: "house",    emoji: "🐶", action: "Run away" },
  hamster:   { label: "hamster",   habitat: "house",    emoji: "🐹", action: "Scurry away" },
  snake:     { label: "snake",     habitat: "house",    emoji: "🐍", action: "Slither away" }
};

let currentAnimal = "butterfly";

/* ================== CANVAS ================== */
const pc = document.getElementById('paintCanvas');
const px = pc.getContext('2d');

const fill = document.createElement('canvas');
fill.width = pc.width;
fill.height = pc.height;
const fx = fill.getContext('2d');

function fitCanvas(){
  const panel = document.getElementById('paintPanel');
  const others = panel.clientHeight
    - document.querySelector('h1').offsetHeight
    - document.getElementById('topControls').offsetHeight
    - document.getElementById('palette').offsetHeight
    - document.getElementById('brushRow').offsetHeight
    - document.getElementById('sendBtn').offsetHeight
    - document.getElementById('status').offsetHeight
    - 70;

  const maxH = Math.max(150, others);
  const maxW = panel.clientWidth - 24;
  const ratio = 320 / 300;

  let w = maxW;
  let h = w / ratio;

  if (h > maxH) {
    h = maxH;
    w = h * ratio;
  }

  pc.style.width = w + 'px';
  pc.style.height = h + 'px';
}

window.addEventListener('resize', fitCanvas);

/* ================== PALETTE ================== */
const colours = [
  "#e53935",
  "#fb8c00",
  "#fdd835",
  "#43a047",
  "#1e88e5",
  "#8e24aa",
  "#ec407a",
  "#00acc1",
  "#6d4c41",
  "#000000",
  "#ffffff"
];

let currentColour = colours[5];

const palette = document.getElementById('palette');

colours.forEach((c) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (c === currentColour ? ' active' : '');
  s.style.background = c;

  s.onclick = () => {
    currentColour = c;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    updateBrushPreview();
  };

  palette.appendChild(s);
});

/* ================== BRUSH ================== */
const brushSizeEl = document.getElementById('brushSize');
const brushPrev = document.querySelector('#brushPreview div');
let brushSize = Number(brushSizeEl.value);

function updateBrushPreview(){
  brushPrev.style.width = brushSize + 'px';
  brushPrev.style.height = brushSize + 'px';
  brushPrev.style.background = currentColour === '#ffffff' ? '#ccc' : currentColour;
}

brushSizeEl.addEventListener('input', () => {
  brushSize = Number(brushSizeEl.value);
  updateBrushPreview();
});

/* ================== CREATURE PATHS ================== */
function creaturePath(ctx){
  const cx = 160;
  const cy = 150;

  ctx.beginPath();

  /* ---------- GARDEN ---------- */
  if (currentAnimal === "butterfly") {
    // left upper wing
    ctx.moveTo(cx, cy);
    ctx.bezierCurveTo(cx - 90, cy - 110, cx - 150, cy - 60, cx - 60, cy - 10);
    ctx.bezierCurveTo(cx - 30, cy - 5, cx - 15, cy - 10, cx, cy);
    // left lower wing
    ctx.moveTo(cx, cy);
    ctx.bezierCurveTo(cx - 50, cy + 20, cx - 110, cy + 40, cx - 70, cy + 95);
    ctx.bezierCurveTo(cx - 40, cy + 115, cx - 15, cy + 60, cx, cy + 10);
    // right upper wing
    ctx.moveTo(cx, cy);
    ctx.bezierCurveTo(cx + 90, cy - 110, cx + 150, cy - 60, cx + 60, cy - 10);
    ctx.bezierCurveTo(cx + 30, cy - 5, cx + 15, cy - 10, cx, cy);
    // right lower wing
    ctx.moveTo(cx, cy);
    ctx.bezierCurveTo(cx + 50, cy + 20, cx + 110, cy + 40, cx + 70, cy + 95);
    ctx.bezierCurveTo(cx + 40, cy + 115, cx + 15, cy + 60, cx, cy + 10);
  }

  else if (currentAnimal === "ladybird") {
    // dome body
    ctx.ellipse(cx, cy + 10, 95, 85, 0, 0, Math.PI * 2);
    // head
    ctx.moveTo(cx + 95, cy + 10);
    ctx.arc(cx, cy - 68, 32, 0, Math.PI * 2);
  }

  else if (currentAnimal === "bee") {
    // body - tapered oval
    ctx.ellipse(cx, cy + 10, 100, 65, 0, 0, Math.PI * 2);
    // head
    ctx.moveTo(cx - 95, cy + 10);
    ctx.arc(cx - 118, cy + 5, 26, 0, Math.PI * 2);
    // upper wing
    ctx.moveTo(cx + 10, cy - 55);
    ctx.ellipse(cx + 25, cy - 75, 50, 28, -0.3, 0, Math.PI * 2);
    // lower wing
    ctx.moveTo(cx - 10, cy - 50);
    ctx.ellipse(cx - 15, cy - 70, 40, 22, -0.4, 0, Math.PI * 2);
  }

  else if (currentAnimal === "frog") {
    // squat body
    ctx.ellipse(cx, cy + 20, 95, 75, 0, 0, Math.PI * 2);
    // left eye bump on top of head
    ctx.moveTo(cx - 45, cy - 48);
    ctx.arc(cx - 45, cy - 48, 26, 0, Math.PI * 2);
    // right eye bump
    ctx.moveTo(cx + 45, cy - 48);
    ctx.arc(cx + 45, cy - 48, 26, 0, Math.PI * 2);
    // left back foot
    ctx.moveTo(cx - 85, cy + 80);
    ctx.ellipse(cx - 108, cy + 88, 35, 16, -0.2, 0, Math.PI * 2);
    // right back foot
    ctx.moveTo(cx + 85, cy + 80);
    ctx.ellipse(cx + 108, cy + 88, 35, 16, 0.2, 0, Math.PI * 2);
  }

  /* ---------- AQUARIUM ---------- */
  else if (currentAnimal === "fish") {

  // body
  ctx.moveTo(60, cy);
  ctx.bezierCurveTo(90, cy-70, 220, cy-70, 260, cy);
  ctx.bezierCurveTo(220, cy+70, 90, cy+70, 60, cy);

  // tail
  ctx.moveTo(260, cy);
  ctx.lineTo(315, cy-55);
  ctx.quadraticCurveTo(300, cy, 315, cy+55);
  ctx.closePath();

  // dorsal fin
  ctx.moveTo(140, cy-55);
  ctx.quadraticCurveTo(170, cy-110, 220, cy-65);

  // bottom fin
  ctx.moveTo(160, cy+35);
  ctx.quadraticCurveTo(180, cy+85, 220, cy+45);

  // side fin
  ctx.moveTo(150, cy+5);
  ctx.quadraticCurveTo(120, cy+40, 155, cy+60);
}

  else if (currentAnimal === "turtle") {

  // shell
  ctx.ellipse(cx, cy, 75, 55, 0, 0, Math.PI*2);

  // head
  ctx.moveTo(cx+75, cy-10);
  ctx.arc(cx+105, cy-10, 22, 0, Math.PI*2);

  // front flipper
  ctx.moveTo(cx+35, cy+20);
  ctx.ellipse(cx+60, cy+50, 18, 35, .7, 0, Math.PI*2);

  // rear flipper
  ctx.moveTo(cx-40, cy+25);
  ctx.ellipse(cx-60, cy+50, 18, 35, -.7, 0, Math.PI*2);

  // top flipper
  ctx.moveTo(cx+20, cy-30);
  ctx.ellipse(cx+45, cy-55, 16, 30, .7, 0, Math.PI*2);

  // tail
  ctx.moveTo(cx-70, cy);
  ctx.lineTo(cx-95, cy-5);
}

  else if (currentAnimal === "jellyfish") {
    // dome
    ctx.moveTo(cx - 85, cy - 5);
    ctx.bezierCurveTo(cx - 75, cy - 110, cx + 75, cy - 110, cx + 85, cy - 5);
    // scalloped skirt
    ctx.quadraticCurveTo(cx + 60, cy + 30, cx + 30, cy);
    ctx.quadraticCurveTo(cx, cy + 30, cx - 30, cy);
    ctx.quadraticCurveTo(cx - 60, cy + 30, cx - 85, cy - 5);
  }

  else if (currentAnimal === "shark") {

  ctx.moveTo(40, cy);

  ctx.bezierCurveTo(
    90, cy-70,
    230, cy-70,
    290, cy
  );

  ctx.bezierCurveTo(
    230, cy+55,
    90, cy+55,
    40, cy
  );

  // tail
  ctx.moveTo(40, cy);
  ctx.lineTo(0, cy-65);
  ctx.lineTo(15, cy-10);

  ctx.moveTo(40, cy);
  ctx.lineTo(0, cy+80);
  ctx.lineTo(20, cy+20);

  // dorsal fin
  ctx.moveTo(150, cy-55);
  ctx.lineTo(185, cy-125);
  ctx.lineTo(220, cy-50);

  // pectoral fin
  ctx.moveTo(180, cy+20);
  ctx.lineTo(170, cy+85);
  ctx.lineTo(220, cy+30);
}

  /* ---------- SAFARI ---------- */
  else if (currentAnimal === "lion") {
    // mane - ring of petals
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      const mx = cx + Math.cos(a) * 88;
      const my = cy + Math.sin(a) * 85;
      ctx.moveTo(mx, my);
      ctx.arc(mx, my, 22, 0, Math.PI * 2);
    }
    // face
    ctx.moveTo(cx + 60, cy);
    ctx.ellipse(cx, cy, 60, 68, 0, 0, Math.PI * 2);
    // ears (small, above mane)
    ctx.moveTo(cx - 42, cy - 58);
    ctx.arc(cx - 48, cy - 64, 14, 0, Math.PI * 2);
    ctx.moveTo(cx + 42, cy - 58);
    ctx.arc(cx + 48, cy - 64, 14, 0, Math.PI * 2);
  }

  else if (currentAnimal === "zebra") {

  // body
  ctx.moveTo(70,220);

  ctx.bezierCurveTo(
    60,140,
    120,100,
    200,110
  );

  ctx.bezierCurveTo(
    260,120,
    280,150,
    270,220
  );

  ctx.closePath();

  // neck
  ctx.moveTo(180,110);
  ctx.lineTo(210,50);
  ctx.lineTo(240,55);
  ctx.lineTo(220,120);

  // head
  ctx.moveTo(210,50);
  ctx.lineTo(260,40);
  ctx.lineTo(285,60);
  ctx.lineTo(250,90);
  ctx.lineTo(220,85);

  // ears
  ctx.moveTo(225,40);
  ctx.lineTo(220,15);
  ctx.lineTo(235,35);

  ctx.moveTo(250,38);
  ctx.lineTo(255,15);
  ctx.lineTo(265,38);

  // legs
  ctx.moveTo(90,220); ctx.lineTo(90,295);
  ctx.moveTo(130,220); ctx.lineTo(130,295);
  ctx.moveTo(210,220); ctx.lineTo(210,295);
  ctx.moveTo(250,220); ctx.lineTo(250,295);

  // tail
  ctx.moveTo(70,140);
  ctx.quadraticCurveTo(35,180,55,220);
}

 else if (currentAnimal === "rhino") {

  ctx.moveTo(50,200);

  ctx.bezierCurveTo(
    50,120,
    120,90,
    240,100
  );

  ctx.bezierCurveTo(
    290,110,
    300,150,
    285,200
  );

  ctx.lineTo(50,200);

  // head
  ctx.moveTo(220,100);

  ctx.bezierCurveTo(
    280,70,
    320,100,
    305,150
  );

  // horn
  ctx.moveTo(290,95);
  ctx.lineTo(315,55);
  ctx.lineTo(280,90);

  // legs
  ctx.moveTo(90,200); ctx.lineTo(90,295);
  ctx.moveTo(140,200); ctx.lineTo(140,295);
  ctx.moveTo(220,200); ctx.lineTo(220,295);
  ctx.moveTo(260,200); ctx.lineTo(260,295);
}

  else if (currentAnimal === "elephant") {
    // body
    ctx.ellipse(cx - 15, cy + 15, 92, 72, 0, 0, Math.PI * 2);
    // head
    ctx.moveTo(cx + 55, cy - 30);
    ctx.arc(cx + 50, cy - 20, 52, 0, Math.PI * 2);
    // large ear
    ctx.moveTo(cx + 10, cy - 25);
    ctx.ellipse(cx + 8, cy - 10, 38, 52, 0.1, 0, Math.PI * 2);
    // trunk curling down
    ctx.moveTo(cx + 92, cy - 5);
    ctx.bezierCurveTo(cx + 125, cy + 20, cx + 125, cy + 65, cx + 105, cy + 90);
    ctx.bezierCurveTo(cx + 90, cy + 110, cx + 70, cy + 108, cx + 68, cy + 88);
    ctx.bezierCurveTo(cx + 65, cy + 68, cx + 80, cy + 60, cx + 95, cy + 75);
    // legs
    ctx.moveTo(cx - 65, cy + 80);  ctx.lineTo(cx - 65, cy + 140);
    ctx.moveTo(cx - 30, cy + 84);  ctx.lineTo(cx - 30, cy + 144);
    ctx.moveTo(cx + 15, cy + 82);  ctx.lineTo(cx + 15, cy + 142);
    ctx.moveTo(cx + 48, cy + 78);  ctx.lineTo(cx + 48, cy + 138);
    // tail
    ctx.moveTo(cx - 106, cy + 5);
    ctx.bezierCurveTo(cx - 128, cy + 5, cx - 132, cy + 28, cx - 120, cy + 45);
  }

  /* ---------- HOUSE ---------- */
 else if (currentAnimal === "cat") {

  // head
  ctx.arc(cx, 90, 45, 0, Math.PI*2);

  // ears
  ctx.moveTo(cx-25,55);
  ctx.lineTo(cx-50,15);

function drawCreatureDetails(ctx){
  const cx = 160;
  const cy = 150;

  ctx.lineWidth = 4;
  ctx.strokeStyle = "#333";
  ctx.fillStyle = "#333";

  function eye(x, y, r){
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#333";
  }

  /* ---------- GARDEN ---------- */
  if (currentAnimal === "butterfly") {
    // body
    ctx.beginPath();
    ctx.ellipse(cx, cy + 25, 9, 55, 0, 0, Math.PI * 2);
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.arc(cx, cy - 30, 12, 0, Math.PI * 2);
    ctx.fill();
    // antennae
    ctx.beginPath();
    ctx.moveTo(cx - 3, cy - 40);
    ctx.quadraticCurveTo(cx - 22, cy - 72, cx - 30, cy - 75);
    ctx.moveTo(cx + 3, cy - 40);
    ctx.quadraticCurveTo(cx + 22, cy - 72, cx + 30, cy - 75);
    ctx.stroke();
    // antenna dots
    ctx.beginPath();
    ctx.arc(cx - 30, cy - 75, 4, 0, Math.PI * 2);
    ctx.arc(cx + 30, cy - 75, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  if (currentAnimal === "ladybird") {
    // centre line
    ctx.beginPath();
    ctx.moveTo(cx, cy - 75);
    ctx.lineTo(cx, cy + 90);
    ctx.stroke();
    // spots
    for (const p of [[-38,-20],[38,-20],[-48,30],[48,30],[-22,68],[22,68]]) {
      ctx.beginPath();
      ctx.arc(cx + p[0], cy + p[1], 13, 0, Math.PI * 2);
      ctx.fill();
    }
    eye(cx - 14, cy - 72, 5);
    eye(cx + 14, cy - 72, 5);
  }

  if (currentAnimal === "bee") {
    // stripes on body
    ctx.lineWidth = 15;
    for (let x = cx - 25; x <= cx + 65; x += 36) {
      ctx.beginPath();
      ctx.moveTo(x, cy - 52);
      ctx.lineTo(x, cy + 58);
      ctx.stroke();
    }
    ctx.lineWidth = 4;
    eye(cx - 118, cy, 5);
    // stinger
    ctx.beginPath();
    ctx.moveTo(cx + 98, cy + 10);
    ctx.lineTo(cx + 118, cy + 5);
    ctx.stroke();
  }

  if (currentAnimal === "frog") {
    eye(cx - 45, cy - 52, 10);
    eye(cx + 45, cy - 52, 10);
    // wide smile
    ctx.beginPath();
    ctx.arc(cx, cy + 18, 42, 0.15, Math.PI - 0.15);
    ctx.stroke();
    // nostrils
    ctx.beginPath();
    ctx.arc(cx - 12, cy - 8, 4, 0, Math.PI * 2);
    ctx.arc(cx + 12, cy - 8, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---------- AQUARIUM ---------- */
 if (currentAnimal === "fish") {

  eye(95, 135, 10);

  // mouth
  ctx.beginPath();
  ctx.arc(55, 155, 15, 0.4, 1.8);
  ctx.stroke();

  // gill
  ctx.beginPath();
  ctx.arc(110, 150, 40, 1.8, 4.5);
  ctx.stroke();

  // fin lines
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(155,155);
    ctx.lineTo(125+i*8,175+i*3);
    ctx.stroke();
  }

  // tail rays
  for(let i=0;i<6;i++){
    ctx.beginPath();
    ctx.moveTo(260,150);
    ctx.lineTo(295,105+i*18);
    ctx.stroke();
  }
}

  if (currentAnimal === "turtle") {

  eye(cx+108, cy-15, 6);

  // shell pattern
  ctx.beginPath();
  ctx.ellipse(cx,cy,45,32,0,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx-45,cy);
  ctx.lineTo(cx+45,cy);

  ctx.moveTo(cx,cy-32);
  ctx.lineTo(cx,cy+32);

  ctx.stroke();

  // mouth
  ctx.beginPath();
  ctx.moveTo(cx+118,cy+2);
  ctx.lineTo(cx+130,cy+5);
  ctx.stroke();
}

  if (currentAnimal === "jellyfish") {
    // wavy tentacles
    for (let i = -45; i <= 45; i += 22) {
      ctx.beginPath();
      ctx.moveTo(cx + i, cy + 12);
      ctx.bezierCurveTo(cx + i - 18, cy + 50, cx + i + 18, cy + 80, cx + i, cy + 120);
      ctx.stroke();
    }
    // eyes
    eye(cx - 20, cy - 42, 6);
    eye(cx + 20, cy - 42, 6);
    // inner dome ring
    ctx.beginPath();
    ctx.ellipse(cx, cy - 40, 50, 35, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

 if (currentAnimal === "shark") {

  eye(240,130,8);

  // gills
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(210+i*10,125);
    ctx.lineTo(205+i*10,155);
    ctx.stroke();
  }

  // mouth
  ctx.beginPath();
  ctx.moveTo(275,165);
  ctx.lineTo(240,175);
  ctx.stroke();

  // teeth
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(245+i*6,170);
    ctx.lineTo(248+i*6,177);
    ctx.lineTo(251+i*6,170);
    ctx.stroke();
  }
}
  /* ---------- SAFARI ---------- */
  if (currentAnimal === "lion") {
    eye(cx - 22, cy - 18, 7);
    eye(cx + 22, cy - 18, 7);
    // nose
    ctx.beginPath();
    ctx.arc(cx, cy + 2, 7, 0, Math.PI * 2);
    ctx.fill();
    // muzzle line + smile
    ctx.beginPath();
    ctx.moveTo(cx, cy + 9);
    ctx.lineTo(cx, cy + 20);
    ctx.moveTo(cx - 18, cy + 22);
    ctx.bezierCurveTo(cx - 10, cy + 30, cx + 10, cy + 30, cx + 18, cy + 22);
    ctx.stroke();
    // whisker dots
    ctx.beginPath();
    for (const p of [[-30, 8],[-20, 12],[-30, 18],[30, 8],[20, 12],[30, 18]]) {
      ctx.arc(cx + p[0], cy + p[1], 2.5, 0, Math.PI * 2);
    }
    ctx.fill();
  }

 if (currentAnimal === "zebra") {

  eye(245,60,6);

  // nostril
  ctx.beginPath();
  ctx.arc(275,70,3,0,Math.PI*2);
  ctx.fill();

  // mane
  for(let i=0;i<7;i++){
    ctx.beginPath();
    ctx.moveTo(205+i*3,50+i*10);
    ctx.lineTo(190+i*3,35+i*10);
    ctx.stroke();
  }

  // stripes
  const stripes = [
    [90,130,110,220],
    [120,120,140,220],
    [150,115,170,220],
    [180,120,195,220],
    [210,130,220,210]
  ];

  stripes.forEach(s=>{
    ctx.beginPath();
    ctx.moveTo(s[0],s[1]);
    ctx.lineTo(s[2],s[3]);
    ctx.stroke();
  });
}
  }

 if (currentAnimal === "rhino") {

  eye(250,115,6);

  // nostril
  ctx.beginPath();
  ctx.arc(295,145,4,0,Math.PI*2);
  ctx.fill();

  // shoulder plate
  ctx.beginPath();
  ctx.arc(170,150,45,1.3,4.8);
  ctx.stroke();

  // body folds
  ctx.beginPath();
  ctx.moveTo(120,120);
  ctx.lineTo(140,200);

  ctx.moveTo(210,110);
  ctx.lineTo(220,200);

  ctx.stroke();
}

  if (currentAnimal === "elephant") {
    eye(cx + 72, cy - 38, 7);
    // ear inner
    ctx.beginPath();
    ctx.ellipse(cx + 10, cy - 8, 24, 34, 0.1, 0, Math.PI * 2);
    ctx.stroke();
    // toenails - short lines at bottom of legs
    ctx.lineWidth = 3;
    for (const lx of [cx - 65, cx - 30, cx + 15, cx + 48]) {
      ctx.beginPath();
      ctx.moveTo(lx - 8, cy + 140);
      ctx.lineTo(lx - 8, cy + 148);
      ctx.moveTo(lx, cy + 141);
      ctx.lineTo(lx, cy + 149);
      ctx.moveTo(lx + 8, cy + 140);
      ctx.lineTo(lx + 8, cy + 148);
      ctx.stroke();
    }
    ctx.lineWidth = 4;
  }

  /* ---------- HOUSE ---------- */
 if (currentAnimal === "cat") {

  eye(cx-18,90,7);
  eye(cx+18,90,7);

  // nose
  ctx.beginPath();
  ctx.moveTo(cx,105);
  ctx.lineTo(cx-6,112);
  ctx.lineTo(cx+6,112);
  ctx.closePath();
  ctx.fill();

  // mouth
  ctx.beginPath();
  ctx.moveTo(cx,112);
  ctx.lineTo(cx,120);

  ctx.moveTo(cx,120);
  ctx.bezierCurveTo(cx-10,130,cx-20,130,cx-22,120);

  ctx.moveTo(cx,120);
  ctx.bezierCurveTo(cx+10,130,cx+20,130,cx+22,120);

  ctx.stroke();

  // whiskers
  for(let i=0;i<3;i++){

    ctx.beginPath();

    ctx.moveTo(cx-10,110+i*8);
    ctx.lineTo(cx-55,105+i*6);

    ctx.moveTo(cx+10,110+i*8);
    ctx.lineTo(cx+55,105+i*6);

    ctx.stroke();
  }
}

if (currentAnimal === "dog") {

  eye(175,95,7);
  eye(205,95,7);

  // nose
  ctx.beginPath();
  ctx.ellipse(190,120,10,8,0,0,Math.PI*2);
  ctx.fill();

  // mouth
  ctx.beginPath();

  ctx.moveTo(190,128);

  ctx.bezierCurveTo(
    180,
    138,
    170,
    138,
    165,
    130
  );

  ctx.moveTo(190,128);

  ctx.bezierCurveTo(
    200,
    138,
    210,
    138,
    215,
    130
  );

  ctx.stroke();
}

  if (currentAnimal === "hamster") {

  eye(cx-20,150,8);
  eye(cx+20,150,8);

  ctx.beginPath();
  ctx.arc(cx,170,5,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(cx,175);

  ctx.bezierCurveTo(
    cx-10,
    185,
    cx-20,
    185,
    cx-20,
    175
  );

  ctx.moveTo(cx,175);

  ctx.bezierCurveTo(
    cx+10,
    185,
    cx+20,
    185,
    cx+20,
    175
  );

  ctx.stroke();

  // whiskers
  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(cx-5,170);
  ctx.lineTo(cx-40,165);

  ctx.moveTo(cx+5,170);
  ctx.lineTo(cx+40,165);

  ctx.stroke();

  ctx.lineWidth = 4;
}

 if (currentAnimal === "snake") {

  eye(cx+35,18,4);

  // tongue
  ctx.strokeStyle = "#c62828";
  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(cx+22,20);
  ctx.lineTo(cx+5,14);

  ctx.moveTo(cx+22,20);
  ctx.lineTo(cx+5,26);

  ctx.stroke();

  ctx.strokeStyle = "#333";
  ctx.lineWidth = 4;

  // scales
  for(let a=0;a<360;a+=25){

    const r = a*Math.PI/180;

    const x = cx + Math.cos(r)*50;
    const y = 180 + Math.sin(r)*50;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      6,
      0,
      Math.PI*2
    );

    ctx.stroke();

function render(forExport = false){
  px.clearRect(0, 0, pc.width, pc.height);

  if (!forExport) {
    px.fillStyle = "#fff";
    px.fillRect(0, 0, pc.width, pc.height);
  }

  px.drawImage(fill, 0, 0);

  px.lineWidth = 4;
  px.strokeStyle = "#333";
  creaturePath(px);
  px.stroke();

  drawCreatureDetails(px);
}

/* ================== PAINTING ================== */
let painting = false;

function paintAt(x, y){
  fx.save();
  creaturePath(fx);
  fx.clip();

  fx.fillStyle = currentColour;
  fx.beginPath();
  fx.arc(x, y, brushSize, 0, Math.PI * 2);
  fx.fill();

  fx.restore();
  render();
}

function pos(e){
  const r = pc.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;

  return {
    x: (t.clientX - r.left) * (pc.width / r.width),
    y: (t.clientY - r.top) * (pc.height / r.height)
  };
}

function down(e){
  painting = true;
  const p = pos(e);
  paintAt(p.x, p.y);
  e.preventDefault();
}

function move(e){
  if (painting) {
    const p = pos(e);
    paintAt(p.x, p.y);
    e.preventDefault();
  }
}

function up(){
  painting = false;
}

pc.addEventListener('mousedown', down);
pc.addEventListener('mousemove', move);
window.addEventListener('mouseup', up);

pc.addEventListener('touchstart', down, { passive:false });
pc.addEventListener('touchmove', move, { passive:false });
pc.addEventListener('touchend', up);

/* ================== ANIMAL CHANGE ================== */
const animalSelect = document.getElementById('animalSelect');
const titleText = document.getElementById('titleText');
const sendBtn = document.getElementById('sendBtn');

function updateAnimalText(){
  const m = animalMeta[currentAnimal];
  titleText.textContent = `Paint your ${m.label}, then send it away!`;
  sendBtn.textContent = `${m.action}! ${m.emoji}`;
}

animalSelect.addEventListener('change', () => {
  currentAnimal = animalSelect.value;
  fx.clearRect(0, 0, fill.width, fill.height);
  updateAnimalText();
  render();
});

/* ================== SEND TO FIRESTORE ================== */
const statusEl = document.getElementById('status');

sendBtn.onclick = async () => {
  const meta = animalMeta[currentAnimal];

  render(true);
  const dataUrl = pc.toDataURL('image/png');
  render();

  sendBtn.disabled = true;
  statusEl.textContent = meta.habitat === "garden"
    ? "Sending to the garden..."
    : meta.habitat === "aquarium"
    ? "Sending to the aquarium..."
    : meta.habitat === "safari"
    ? "Sending to the safari..."
    : "Sending home...";

  try {
    await addDoc(creaturesCol, {
      img: dataUrl,
      animal: currentAnimal,
      habitat: meta.habitat,
      createdAt: serverTimestamp()
    });

    statusEl.textContent = `Off it goes! ${meta.emoji}`;

    fx.clearRect(0, 0, fill.width, fill.height);
    render();

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Hmm, couldn't send. Try again.";
  } finally {
    sendBtn.disabled = false;
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
  }
};

async function deleteByQuery(q, label){
  if (!confirm(`Are you sure you want to delete ${label}?`)) return;

  adminStatus.textContent = "Deleting...";
  const snap = await getDocs(q);

  const jobs = [];
  snap.forEach(d => {
    jobs.push(deleteDoc(doc(db, "creatures", d.id)));
  });

  await Promise.all(jobs);

  adminStatus.textContent = `Deleted ${jobs.length} drawing(s).`;
  loadRecentDrawings();
}

document.getElementById('deleteAll').onclick = async () => {
  await deleteByQuery(query(creaturesCol), "ALL drawings");
};

document.getElementById('deleteGarden').onclick = async () => {
  await deleteByQuery(
    query(creaturesCol, where("habitat", "==", "garden")),
    "all garden drawings"
  );
};

document.getElementById('deleteAquarium').onclick = async () => {
  await deleteByQuery(
    query(creaturesCol, where("habitat", "==", "aquarium")),
    "all aquarium drawings"
  );
};

document.getElementById('deleteSafari').onclick = async () => {
  await deleteByQuery(

  );
};

document.getElementById('deleteHouse').onclick = async () => {

    query(creaturesCol, where("habitat", "==", "house")),

  );
};

document.getElementById('loadRecent').onclick = loadRecentDrawings;

async function loadRecentDrawings(){
  adminStatus.textContent = "Loading recent drawings...";
  adminList.innerHTML = "";

  const q = query(
    creaturesCol,
    orderBy("createdAt", "desc"),
    limit(30)
  );

  const snap = await getDocs(q);

  snap.forEach(d => {
    const data = d.data();

    const card = document.createElement("div");
    card.className = "adminCard";

    const img = document.createElement("img");
    img.src = data.img;

    const label = document.createElement("small");
    label.textContent = `${data.animal || "unknown"} / ${data.habitat || "unknown"}`;

    const respawnBtn = document.createElement("button");
    respawnBtn.textContent = "Respawn";
    respawnBtn.onclick = async () => {
      await addDoc(creaturesCol, {
        img: data.img,
        animal: data.animal,
        habitat: data.habitat,
        createdAt: serverTimestamp(),
        respawned: true
      });

      adminStatus.textContent = "Drawing respawned.";
    };

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "danger";
    deleteBtn.textContent = "Delete";
    deleteBtn.onclick = async () => {
      if (!confirm("Delete this drawing?")) return;
      await deleteDoc(doc(db, "creatures", d.id));
      adminStatus.textContent = "Drawing deleted.";
      loadRecentDrawings();
    };

    card.appendChild(img);
    card.appendChild(label);
    card.appendChild(respawnBtn);
    card.appendChild(deleteBtn);

    adminList.appendChild(card);
  });

  adminStatus.textContent = `Loaded ${snap.size} drawing(s).`;
}
